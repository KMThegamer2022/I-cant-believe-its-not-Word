<!-- ═══════ EDITOR AREA ═══════ -->
<div id="main-area" style="display:flex;flex:1;overflow:hidden">
  <!-- Navigation Pane -->
  <div id="nav-pane" style="display:none;width:260px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:12px">
    <div style="display:flex;gap:4px;margin-bottom:12px">
      <button class="rbtn small active" onclick="navPaneTab('headings')" id="nav-headings">Headings</button>
      <button class="rbtn small" onclick="navPaneTab('pages')" id="nav-pages">Pages</button>
      <button class="rbtn small" onclick="navPaneTab('results')" id="nav-results">Results</button>
    </div>
    <div id="nav-headings-list"></div>
    <div id="nav-pages-list" style="display:none"></div>
    <div id="nav-results-list" style="display:none"></div>
  </div>
  <!-- Page Container -->
  <div id="page-container" style="flex:1;overflow:auto;background:var(--page-bg);padding:20px">
    <div id="editor-page" style="background:#fff;width:816px;min-height:1056px;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:72px 72px;position:relative;outline:none;font-size:12pt;line-height:1.15" contenteditable="true" spellcheck="true">
      <p>Start typing your document here...</p>
    </div>
    <!-- Drawing canvas overlay -->
    <canvas id="ink-canvas" style="display:none;position:absolute;top:0;left:0;pointer-events:none;z-index:50"></canvas>
  </div>
  <!-- Comments Pane -->
  <div id="comments-pane" style="display:none;width:280px;background:#f9f9f9;border-left:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>Comments</b>
      <button onclick="document.getElementById('comments-pane').style.display='none'" style="font-size:16px">&times;</button>
    </div>
    <div id="comments-list"></div>
  </div>
  <!-- Editor/Proofing Pane -->
  <div id="editor-pane" style="display:none;width:280px;background:#fff;border-left:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>&#9998; Editor</b>
      <button onclick="document.getElementById('editor-pane').style.display='none'" style="font-size:16px">&times;</button>
    </div>
    <div id="editor-results" style="font-size:12px"></div>
  </div>
</div>
<!-- ═══════ STATUS BAR ═══════ -->
<div id="statusbar" style="height:26px;background:var(--status-blue);color:#fff;display:flex;align-items:center;padding:0 12px;font-size:12px;gap:12px;user-select:none">
  <span id="sb-page">Page 1 of 1</span>
  <span id="sb-words">0 words</span>
  <span id="sb-chars">0 characters</span>
  <span id="sb-lang">English (United States)</span>
  <span id="sb-accessibility">&#128100; Accessibility: Good</span>
  <span id="sb-track" style="display:none">&#9998; Track Changes: On</span>
  <div style="flex:1"></div>
  <!-- View shortcuts -->
  <button onclick="setView('read')" style="color:#fff;font-size:11px;padding:2px 6px;border-radius:2px" title="Read Mode">&#128214;</button>
  <button onclick="setView('print')" style="color:#fff;font-size:11px;padding:2px 6px;border-radius:2px" title="Print Layout">&#128196;</button>
  <button onclick="setView('web')" style="color:#fff;font-size:11px;padding:2px 6px;border-radius:2px" title="Web Layout">&#127760;</button>
  <!-- Zoom -->
  <div style="display:flex;align-items:center;gap:6px">
    <span>&minus;</span>
    <input type="range" id="zoom-slider" min="10" max="500" value="100" style="width:100px" oninput="setZoom(this.value/100)">
    <span>+</span>
    <span id="zoom-pct" style="min-width:36px;text-align:right">100%</span>
  </div>
</div>
<!-- ═══════ FIND / REPLACE OVERLAY ═══════ -->
<div id="find-replace-bar" style="display:none;position:fixed;top:160px;right:20px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:12px;z-index:2000;width:340px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b>Find and Replace</b>
    <button onclick="document.getElementById('find-replace-bar').style.display='none'" style="font-size:18px">&times;</button>
  </div>
  <div style="display:flex;gap:4px;margin-bottom:6px">
    <label style="width:70px;font-size:12px">Find:</label>
    <input id="find-input" style="flex:1;border:1px solid #ccc;border-radius:3px;padding:4px" onkeydown="if(event.key==='Enter')doFindNext()">
    <button onclick="doFindPrev()" class="rbtn small">&#9650;</button>
    <button onclick="doFindNext()" class="rbtn small">&#9660;</button>
  </div>
  <div style="display:flex;gap:4px;margin-bottom:6px">
    <label style="width:70px;font-size:12px">Replace:</label>
    <input id="replace-input" style="flex:1;border:1px solid #ccc;border-radius:3px;padding:4px">
  </div>
  <div style="display:flex;gap:4px">
    <label style="display:flex;align-items:center;gap:2px;font-size:11px"><input type="checkbox" id="find-case"> Match case</label>
    <label style="display:flex;align-items:center;gap:2px;font-size:11px"><input type="checkbox" id="find-words"> Whole word</label>
  </div>
  <div style="display:flex;gap:4px;margin-top:8px">
    <button onclick="doReplace()" class="rbtn small">Replace</button>
    <button onclick="doReplaceAll()" class="rbtn small">Replace All</button>
    <span id="find-count" style="font-size:11px;color:#888;margin-left:auto"></span>
  </div>
</div>
<!-- ═══════ TABLE GRID PICKER ═══════ -->
<div id="table-picker" style="display:none;position:fixed;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:10px;z-index:2000">
  <div id="table-grid" style="display:grid;grid-template-columns:repeat(10,24px);gap:2px"></div>
  <div id="table-grid-label" style="text-align:center;margin-top:6px;font-size:12px">Insert Table</div>
</div>
<!-- ═══════ MODAL ═══════ -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:3000;justify-content:center;align-items:center">
  <div id="modal-box" style="background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3);min-width:440px;max-width:600px;max-height:80vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)">
      <b id="modal-title" style="font-size:15px">Dialog</b>
      <button onclick="closeModal()" style="font-size:20px;cursor:pointer">&times;</button>
    </div>
    <div id="modal-content" style="padding:18px"></div>
  </div>
</div>
<!-- ═══════ BACKSTAGE (FILE MENU) ═══════ -->
<div id="backstage" style="display:none;position:fixed;inset:0;background:#fff;z-index:5000">
  <div style="display:flex;height:100%">
    <div style="width:200px;background:var(--blue);color:#fff;padding:20px 0">
      <button onclick="closeBackstage()" style="color:#fff;font-size:28px;padding:8px 20px;margin-bottom:20px">&#8592;</button>
      <div class="bs-nav" onclick="showBackstagePanel('new')" style="padding:10px 20px;cursor:pointer">New</div>
      <div class="bs-nav" onclick="showBackstagePanel('open')" style="padding:10px 20px;cursor:pointer">Open</div>
      <div class="bs-nav" onclick="showBackstagePanel('info')" style="padding:10px 20px;cursor:pointer">Info</div>
      <div class="bs-nav" onclick="showBackstagePanel('save')" style="padding:10px 20px;cursor:pointer">Save</div>
      <div class="bs-nav" onclick="showBackstagePanel('saveas')" style="padding:10px 20px;cursor:pointer">Save As</div>
      <div class="bs-nav" onclick="showBackstagePanel('print')" style="padding:10px 20px;cursor:pointer">Print</div>
      <div class="bs-nav" onclick="showBackstagePanel('share')" style="padding:10px 20px;cursor:pointer">Share</div>
      <div class="bs-nav" onclick="showBackstagePanel('export')" style="padding:10px 20px;cursor:pointer">Export</div>
      <div class="bs-nav" onclick="showBackstagePanel('transform')" style="padding:10px 20px;cursor:pointer">Transform</div>
      <div class="bs-nav" onclick="showBackstagePanel('account')" style="padding:10px 20px;cursor:pointer">Account</div>
      <div class="bs-nav" onclick="showBackstagePanel('options')" style="padding:10px 20px;cursor:pointer">Options</div>
    </div>
    <div id="backstage-content" style="flex:1;padding:30px;overflow-y:auto"></div>
  </div>
</div>
