<script>
// ═══════════════ FIND / REPLACE ═══════════════
function showFind() { document.getElementById('find-replace-bar').style.display = 'block'; document.getElementById('find-input').focus(); }
function showReplace() { showFind(); }
function doFindNext() {
  const q = document.getElementById('find-input').value;
  if (!q) return;
  const found = window.find(q, false, document.getElementById('find-case').checked, false);
  document.getElementById('find-count').textContent = found ? 'Found' : 'Not found';
}
function doFindPrev() { /* basic: just search again */ doFindNext(); }
function doReplace() {
  const find = document.getElementById('find-input').value;
  const repl = document.getElementById('replace-input').value;
  if (!find) { doFindNext(); return; }
  const sel = window.getSelection();
  // deleteContents()/insertNode() are Range methods — Selection has neither
  if (sel.rangeCount && sel.toString().toLowerCase() === find.toLowerCase()) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(document.createTextNode(repl));
    saveUndo();
  } else { doFindNext(); }
}
function doReplaceAll() {
  const find = document.getElementById('find-input').value;
  const repl = document.getElementById('replace-input').value;
  if (!find) return;
  const esc = find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(esc, document.getElementById('find-case').checked ? 'g' : 'gi');
  let count = 0;
  const walk = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n => {
    if (re.test(n.textContent)) {
      const before = n.textContent;
      n.textContent = before.replace(re, () => { count++; return repl; });
      re.lastIndex = 0;
    }
  });
  document.getElementById('find-count').textContent = `Replaced ${count} occurrence${count!==1?'s':''}`;
  saveUndo(); updateStatus();
}
function showSelectMenu() {
  showModal('Select', `
    <button onclick="cmd('selectAll');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;cursor:pointer">Select All (Ctrl+A)</button>
    <button onclick="selectObjects();closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;cursor:pointer">Select Objects</button>
    <button onclick="selectSimilarFormat();closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;cursor:pointer">Select Text with Similar Formatting</button>`);
}
function selectObjects() { alert('Click and drag to select objects, or use Ctrl+click for multiple selection.'); }
function selectSimilarFormat() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { alert('Select some text first.'); return; }
  alert('Selecting all text with similar formatting...');
}

// ═══════════════ DICTATION ═══════════════
let dictating = false, recognition = null;
function toggleDictate() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported in this browser. Try Chrome or Edge.'); return; }
  if (dictating) { recognition.stop(); dictating = false; return; }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (final) editor.focus(), document.execCommand('insertText', false, final);
  };
  recognition.start();
  dictating = true;
  alert('🎤 Dictation started. Speak now... Click OK when done to stop.');
  recognition.stop(); dictating = false;
}

// ═══════════════ EDITOR / PROOFING ═══════════════
// small JS-string escaper for inline onclick handlers
function jsEsc(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
// A detached copy of the editor with spell-check markup (module 09) stripped. Every
// export/persistence path must go through this — writing editor.innerHTML directly bakes
// the red squiggle wrappers and their #c00 text colour into saved files and autosaves.
function cleanEditorNode() {
  const clone = editor.cloneNode(true);
  clone.querySelectorAll('.icw-spell, .icw-grammar, .icw-ignore')
    .forEach(s => s.replaceWith(document.createTextNode(s.textContent)));
  return clone;
}
function cleanEditorHTML() { return cleanEditorNode().innerHTML; }
// Character offset of a (container, offset) point within the editor's text stream, or -1.
function nodeOffset(root, container, offset) {
  if (!container || !root.contains(container)) return -1;
  let total = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (n === container) return total + Math.min(offset, n.length);
    total += n.length;
  }
  return total;
}
// Locate a whole-word occurrence of `word`. With fromCaret, the first match at or after the
// caret wins so clicking a suggestion fixes the instance the user is looking at.
function findWordOccurrence(word, fromCaret) {
  // global flag: a text node can hold several occurrences and we must see them all
  const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
  const sel = window.getSelection();
  const caretAt = sel.rangeCount ? nodeOffset(editor, sel.anchorNode, sel.anchorOffset) : -1;
  const walk = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let acc = 0, first = null, n;
  while ((n = walk.nextNode())) {
    const text = n.textContent;
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      const hit = { node: n, start: m.index, abs: acc + m.index };
      if (!first) first = hit;
      // caret unknown (-1) or this match sits at/after the caret: this is the one
      if (!fromCaret || caretAt < 0 || hit.abs >= caretAt) return hit;
    }
    acc += text.length;
  }
  return first; // wrap around to the first match, like Find & Replace
}
function editorReplaceSuggestion(word, replacement) {
  hideContextMenu();
  if (!word || !replacement) { showToast('No replacement available', 'warn'); return; }
  editor.focus();
  const sel = window.getSelection();
  if (sel.rangeCount && sel.toString() === word) {
    // insertText replaces the selection itself. Deleting the range first looked equivalent
    // but makes Chrome swallow the character after the insertion point.
    document.execCommand('insertText', false, replacement);
  } else {
    const hit = findWordOccurrence(word, true) || findWordOccurrence(word, false);
    if (!hit) { showToast('Could not find "' + word + '" in the document', 'warn'); return; }
    const r = document.createRange();
    r.setStart(hit.node, hit.start); r.setEnd(hit.node, hit.start + word.length);
    sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('insertText', false, replacement);
  }
  saveUndo(); updateStatus();
  showToast('Replaced "' + word + '" with "' + replacement + '"', 'ok');
  // re-run the spell pass so the squiggle clears, then refresh the panel
  try { markSpellingErrors(); showEditorPanel(); } catch (e) {}
}
function showEditorPanel() {
  const pane = document.getElementById('editor-pane');
  pane.style.display = 'flex'; pane.style.flexDirection = 'column';
  const text = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/) : [];
  const spellRes = (typeof spellCheckWords === 'function') ? spellCheckWords(text) : { misspelled: [] };
  const grammarRes = (typeof checkGrammarIssues === 'function') ? checkGrammarIssues(text) : [];
  const conciseRes = (typeof checkConcisenessIssues === 'function') ? checkConcisenessIssues(text) : [];
  const total = spellRes.misspelled.length + grammarRes.length + conciseRes.length;
  const score = Math.max(0, 100 - total * 3);
  const scol = score >= 90 ? '#2e7d32' : score >= 60 ? '#f5a623' : '#c00';
  let html = `<div style="margin-bottom:10px"><b>Editor Score</b><div style="font-size:17pt;font-weight:800;color:${scol}">${score}%</div><div style="font-size:11px;color:var(--text-2);margin-top:2px">Calculated at ${words.length} words</div></div>`;
  html += `<div class="ecat">Corrections</div>`;
  html += ecard('Spelling', spellRes.misspelled.length, spellRes.misspelled.slice(0, 8));
  html += ecard('Grammar', grammarRes.length, grammarRes.slice(0, 8));
  html += `<div class="ecat">Refinements</div>`;
  html += ecard('Conciseness', conciseRes.length, conciseRes.slice(0, 8));
  if (!total) html += '<p class="ap-ok" style="margin-top:6px">&#10003; No major issues found!</p>';
  html += '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" style="flex:1" onclick="runAccessibilityChecks();toggleAccessibilityPane(true)">Accessibility</button><button class="btn" style="flex:1" onclick="document.getElementById(\'editor-pane\').style.display=\'none\'">Close</button></div>';
  document.getElementById('editor-results').innerHTML = html;
}
function ecard(title, count, items) {
  const have = items && items.length > 0;
  let chips = '';
  if (have) {
    chips = items.map(it => {
      const w = it.word || it.text || String(it);
      const r = firstReplacement(it);
      // no usable suggestion: show the word as inert text rather than a button that would
      // replace it with itself
      if (!r) return `<span class="enone" title="No suggestion available">${escUser(w)}</span>`;
      return `<button class="ereplace" title="Replace with ${escUser(r)}" onclick="editorReplaceSuggestion('${jsEsc(w)}','${jsEsc(r)}')">${escUser(w)} <span class="earrow">&#8594;</span> ${escUser(r)}</button>`;
    }).join(' ');
  }
  const empty = have ? '' : '<div class="ap-ok">&#10003; None detected</div>';
  const sub = have ? `<div class="esub">Click a suggestion to replace the flagged text.</div>` : '';
  return `<div class="ecard"><div class="etitle">${title}<span class="ecount">${count}</span></div>${sub}<div class="ereplace">${chips}${empty}</div></div>`;
}
// Spelling issues carry a `suggest` ARRAY and an empty `replace`; grammar/conciseness issues
// carry a real `replace` string. Falling through from an empty `replace` to `suggest` used to
// stringify the whole array, so one word was replaced by "a,b,c,d,e".
function firstReplacement(it) {
  if (typeof it.replace === 'string' && it.replace) return it.replace;
  if (Array.isArray(it.suggest)) return it.suggest.length ? String(it.suggest[0]) : '';
  if (typeof it.suggest === 'string') return it.suggest;
  return '';
}
// simple heuristics used until the full spell engine (module 09) supplies detailed results
function checkGrammarIssues(text) {
  const out = [];
  // repeated words
  text.replace(/\b(\w+)\s+\1\b/gi, (m, w) => { out.push({ word: w + ' ' + w, replace: w, text: 'Repeated word' }); return m; });
  // sentence not capitalised after terminal punctuation (very rough)
  text.replace(/([.!?])\s+([a-z])/g, (m, p, l) => { out.push({ word: p + ' ' + l, replace: p + ' ' + l.toUpperCase(), text: 'Capitalize after terminal punctuation' }); return m; });
  return out.slice(0, 8);
}
function checkConcisenessIssues(text) {
  const wordy = [ ['in order to','to'], ['due to the fact that','because'], ['at this point in time','now'], ['for the purpose of','to'], ['make use of','use'] ];
  const out = [];
  wordy.forEach(([a,b]) => {
    const re = new RegExp('\\b'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    if (re.test(text)) out.push({ word: a, replace: b, text: 'Wordy phrase' });
  });
  return out.slice(0, 8);
}
// COMMON_WORDS now lives in module 05a (05a_js_dictionary.html) — bigger base list
// plus runtime inflection expansion.

function showThesaurus() {
  const sel = window.getSelection().toString() || prompt('Enter a word:');
  if (!sel) return;
  const syns = { 'good': ['excellent','fine','great','superb','quality'], 'bad': ['poor','terrible','awful','dreadful','inferior'], 'big': ['large','huge','massive','enormous','giant'], 'small': ['tiny','little','miniature','compact','slight'], 'happy': ['glad','joyful','pleased','delighted','cheerful'], 'sad': ['unhappy','sorrowful','dejected','melancholy','gloomy'] };
  const list = syns[sel.toLowerCase()] || ['(thesaurus offline — try: good, bad, big, small, happy, sad)'];
  showModal('Thesaurus: ' + sel, list.map(s => `<button class="btn" onclick="cmd('insertText','${s}');closeModal()" style="display:block;width:100%;text-align:left;margin-bottom:6px">${s}</button>`).join(''));
}
// showWordCount() now lives in module 05 (with live status-bar counts)
function checkAccessibility() { runAccessibilityChecks(); }
function translateDoc() {
  const sel = window.getSelection().toString();
  if (!sel) { alert('Select text to translate.'); return; }
  window.open(`https://translate.google.com/?sl=en&tl=es&text=${encodeURIComponent(sel)}`, '_blank');
}
function showLangPrefs() { showModal('Language Preferences', '<p>Authoring language: English (United States)</p><p style="margin-top:8px;color:#666">Translation available via Google Translate integration.</p>'); }

// ═══════════════ READ ALOUD ═══════════════
function readAloud() {
  const sel = window.getSelection().toString() || editor.innerText;
  if (!sel.trim()) return;
  const u = new SpeechSynthesisUtterance(sel.substring(0, 5000));
  u.lang = 'en-US'; u.rate = 1;
  speechSynthesis.speak(u);
}

// ═══════════════ COMMENTS ═══════════════
let comments = [], commentIdx = -1;
function addComment() {
  const sel = window.getSelection().toString() || 'General comment';
  const text = prompt('Add a comment:');
  if (!text) return;
  comments.push({ text, quote: sel, resolved: false });
  renderComments();
  document.getElementById('comments-pane').style.display = 'block';
}
function renderComments() {
  const el = document.getElementById('comments-list');
  el.innerHTML = comments.map((c, i) => `
    <div style="background:var(--panel-bg2);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;${c.resolved?'opacity:.5':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <b style="font-size:12px">User</b>
        <span style="font-size:10px;color:var(--text-2)">${new Date().toLocaleTimeString()}</span>
      </div>
      ${c.quote ? `<p style="font-size:11px;color:var(--text-2);border-left:2px solid var(--blue);padding-left:6px;margin-bottom:4px">"${c.quote}"</p>` : ''}
      <p style="font-size:12px">${c.text}</p>
      <div style="margin-top:6px">
        <button onclick="comments[${i}].resolved=!comments[${i}].resolved;renderComments()" style="font-size:11px;color:var(--blue-light);cursor:pointer">${c.resolved ? 'Unresolve' : 'Resolve'}</button>
        <button onclick="comments.splice(${i},1);renderComments()" style="font-size:11px;color:var(--danger);cursor:pointer;margin-left:8px">Delete</button>
      </div>
    </div>`).join('') || '<p style="color:var(--text-2);font-size:11px">No comments yet.</p>';
}
function deleteComment() { if (comments.length) { comments.pop(); renderComments(); } }
function prevComment() { if (commentIdx > 0) commentIdx--; }
function nextComment() { if (commentIdx < comments.length - 1) commentIdx++; }
function resolveComment() { if (commentIdx >= 0 && comments[commentIdx]) { comments[commentIdx].resolved = true; renderComments(); } }

// ═══════════════ TRACK CHANGES ═══════════════
let trackChanges = false;
function toggleTrackChanges() {
  trackChanges = !trackChanges;
  document.getElementById('btn-trackchanges').classList.toggle('active', trackChanges);
  document.getElementById('sb-track').style.display = trackChanges ? 'inline' : 'none';
  if (trackChanges) {
    editor.addEventListener('input', trackInput);
  } else {
    editor.removeEventListener('input', trackInput);
  }
}
function trackInput() {
  // Simple visual indicator for tracked changes
  editor.querySelectorAll('ins,del').forEach(el => {
    if (el.style.display === '') {
      if (el.tagName === 'INS') el.style.cssText = 'text-decoration:underline;color:#2e7d32';
    }
  });
}
function setMarkupView(v) {
  if (v === 'original') alert('Showing original document (tracked changes hidden).');
  else if (v === 'simple') alert('Simple markup: Change bars shown in margin.');
  else alert('All markup: All changes shown with formatting.');
}
function acceptChange() { alert('Change accepted.'); }
function rejectChange() { alert('Change rejected.'); }
function compareDocs() { showModal('Compare Documents', '<p>Compare two versions of a document side-by-side.</p><button onclick="alert(\'Feature requires two document versions.\');closeModal()" style="margin-top:12px;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer">Select Documents...</button>'); }
function combineDocs() { showModal('Combine Documents', '<p>Combine edits from multiple authors into one document.</p><button onclick="alert(\'Feature requires multiple document versions.\');closeModal()" style="margin-top:12px;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer">Select Documents...</button>'); }
function restrictEditing() {
  showModal('Restrict Editing', `
    <label style="display:block;margin:8px 0"><input type="checkbox" id="restrict-format"> Formatting restrictions</label>
    <label style="display:block;margin:8px 0"><input type="checkbox" id="restrict-edit"> Editing restrictions (read only)</label>
    <label style="display:block;margin:8px 0">Password: <input type="password" style="border:1px solid #ccc;border-radius:4px;padding:4px 8px;margin-left:8px"></label>
    <button onclick="applyRestriction()" style="margin-top:12px;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer">Start Enforcing</button>`);
}
function applyRestriction() {
  const ro = document.getElementById('restrict-edit').checked;
  editor.contentEditable = ro ? 'false' : 'true';
  alert(ro ? 'Document is now read-only.' : 'Editing restrictions removed.');
  closeModal();
}
function blockAuthors() { alert('Author blocking requires a signed-in account.'); }
function encryptDoc() {
  const pw = prompt('Enter a password to encrypt the document:');
  if (!pw) return;
  // Simple XOR "encryption" for demo
  const data = btoa(unescape(encodeURIComponent(editor.innerHTML)));
  localStorage.setItem('encrypted-doc-' + pw, data);
  alert('Document encrypted with password. (Demo — stored in browser localStorage)');
}
function inspectDoc() {
  showModal('Document Inspector', '<p>Checking for hidden data...</p><p style="margin-top:8px;color:#2e7d32">&#10003; No hidden data found</p><p style="margin-top:4px;color:#666;font-size:11px">Checked: Comments, tracked changes, document properties, hidden text</p>');
}
function showMacros() {
  showModal('Macros', `
    <p style="margin-bottom:8px">Macro name:</p>
    <input id="macro-name" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;margin-bottom:8px" placeholder="MyMacro">
    <div id="macro-list" style="border:1px solid #ddd;border-radius:4px;max-height:150px;overflow-y:auto;margin-bottom:8px">
      <p style="padding:8px;color:#999">No macros recorded yet.</p>
    </div>
    <button onclick="runMacro()" style="padding:6px 16px;border:1px solid #ddd;border-radius:4px;cursor:pointer;margin-right:8px">Run</button>
    <button onclick="createMacro()" style="padding:6px 16px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer">Create</button>`);
}
let macros = [];
function recordMacro() {
  const name = prompt('Macro name:', 'Macro' + (macros.length + 1));
  if (!name) return;
  alert('Recording macro "' + name + '". Perform actions, then stop recording.');
  macros.push({ name, steps: [] });
  setTimeout(() => alert('Macro recording stopped.'), 5000);
}
function createMacro() {
  const name = document.getElementById('macro-name').value;
  if (!name) return;
  const code = prompt('Enter macro code:\nAvailable commands: bold, italic, underline, insertText(text), applyStyle(name)');
  if (!code) return;
  macros.push({ name, code });
  closeModal();
}
function runMacro() {
  const name = document.getElementById('macro-name')?.value;
  const m = macros.find(x => x.name === name);
  if (!m) { alert('Macro not found.'); return; }
  try {
    if (m.code) {
      const fn = new Function('cmd','editor','alert', m.code);
      fn(cmd, editor, alert);
    }
  } catch(e) { alert('Macro error: ' + e.message); }
  closeModal();
}

// ═══════════════ DRAW ═══════════════
let drawing = false, drawMode = false, currentPen = 'pen', strokes = [];
function setPen(p) {
  currentPen = p;
  ensureInkCanvas();
  if (!drawMode) toggleDrawMode();
}
// The ink canvas lives inside #editor-page so ink is clipped to the page, but any
// editor.innerHTML assignment (new/open/import) destroys it. Recreate on demand.
function ensureInkCanvas() {
  var page = document.getElementById('editor-page');
  var canvas = document.getElementById('ink-canvas');
  if (canvas && canvas.parentNode === page) return canvas;
  if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
  canvas = document.createElement('canvas');
  canvas.id = 'ink-canvas';
  canvas.style.display = 'none';
  page.appendChild(canvas);
  return canvas;
}
function toggleDrawMode() {
  drawMode = !drawMode;
  var btn = document.getElementById('btn-drawmode');
  if (btn) btn.classList.toggle('active', drawMode);
  var canvas = ensureInkCanvas();
  var page = document.getElementById('editor-page');
  if (drawMode) {
    // Canvas is inside editor-page, so position at 0,0 relative to page
    canvas.width = page.offsetWidth;
    canvas.height = page.offsetHeight;
    canvas.style.display = 'block';
    canvas.style.position = 'absolute';
    canvas.style.left = '0';
    canvas.style.top = '0';
    canvas.style.width = page.offsetWidth + 'px';
    canvas.style.height = page.offsetHeight + 'px';
    canvas.style.pointerEvents = 'auto';
    canvas.style.cursor = 'crosshair';
    canvas.style.zIndex = '50';
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', doDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', doDraw);
    canvas.addEventListener('touchend', endDraw);
    // Show visual indicator
    showDrawIndicator(true);
    // Listen for Escape to exit
    document.addEventListener('keydown', drawEscapeHandler);
  } else {
    canvas.style.display = 'none';
    canvas.style.pointerEvents = 'none';
    canvas.removeEventListener('mousedown', startDraw);
    canvas.removeEventListener('mousemove', doDraw);
    canvas.removeEventListener('mouseup', endDraw);
    canvas.removeEventListener('mouseleave', endDraw);
    canvas.removeEventListener('touchstart', startDraw);
    canvas.removeEventListener('touchmove', doDraw);
    canvas.removeEventListener('touchend', endDraw);
    showDrawIndicator(false);
    document.removeEventListener('keydown', drawEscapeHandler);
  }
}
function drawEscapeHandler(e) {
  if (e.key === 'Escape' && drawMode) toggleDrawMode();
}
function showDrawIndicator(on) {
  var ind = document.getElementById('draw-indicator');
  if (on) {
    if (!ind) {
      ind = document.createElement('div');
      ind.id = 'draw-indicator';
      ind.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;z-index:9999;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3)';
      ind.textContent = '✏️ Drawing mode — press Esc or click "Draw on Page" to stop';
      document.body.appendChild(ind);
    }
  } else if (ind) ind.remove();
}
function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const canvas = ensureInkCanvas();
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  strokes.push([{ x, y, color: document.getElementById('pen-color').value, size: document.getElementById('pen-size').value, type: currentPen }]);
}
function doDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const canvas = ensureInkCanvas();
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const stroke = strokes[strokes.length - 1];
  const prev = stroke[stroke.length - 1];
  ctx.strokeStyle = stroke[0].color;
  ctx.lineWidth = stroke[0].size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (stroke[0].type === 'highlighter') { ctx.globalAlpha = 0.3; ctx.lineWidth = parseInt(stroke[0].size) * 3; }
  else ctx.globalAlpha = 1;
  if (stroke[0].type === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 20;
  }
  ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  stroke.push({ x, y });
}

// Dropdown helpers.
//
// An open menu is moved into a fixed-position layer on <body>. That keeps it clear of two
// ribbon problems: #ribbon is a horizontal scroller so it clips overflow-y, and any
// animation on a ribbon group makes that group a stacking context, which would trap the
// menu's z-index inside it and drop the menu behind the document. The layer removes both
// dependencies at once, so the ribbon can be animated freely.
function menuLayer() {
  let l = document.getElementById('menu-layer');
  if (!l) {
    l = document.createElement('div');
    l.id = 'menu-layer';
    l.style.cssText = 'position:fixed;inset:0;z-index:7000;pointer-events:none';
    document.body.appendChild(l);
  }
  return l;
}
function positionMenu(menu, btn) {
  const b = btn.getBoundingClientRect();
  menu.style.top = '0px'; menu.style.left = '0px';
  const m = menu.getBoundingClientRect();
  const gap = 2, edge = 6;
  let top = b.bottom + gap;
  if (top + m.height > window.innerHeight - edge) {
    const above = b.top - m.height - gap;
    top = above >= edge ? above : Math.max(edge, window.innerHeight - m.height - edge);
  }
  let left = b.left;
  if (left + m.width > window.innerWidth - edge) left = window.innerWidth - m.width - edge;
  menu.style.top = top + 'px';
  menu.style.left = Math.max(edge, left) + 'px';
}
function openMenu(menu, btn) {
  if (!menu) return;
  if (!menu._home) menu._home = { parent: menu.parentNode, next: menu.nextSibling };
  menu.classList.add('show');
  menu._trigger = btn || null;
  menuLayer().appendChild(menu);
  if (btn) positionMenu(menu, btn);
  else menu.style.top = menu.style.left = '';
}
function closeMenu(menu) {
  if (!menu) return;
  menu.classList.remove('show');
  menu.style.top = '';
  menu.style.left = '';
  menu._trigger = null;
  const home = menu._home;
  if (home && home.parent && home.parent.isConnected && menu.parentNode !== home.parent) {
    const next = home.next && home.next.parentNode === home.parent ? home.next : null;
    home.parent.insertBefore(menu, next);
  }
}
function toggleDropdown(btn, menuId) {
  const menu = document.getElementById(menuId);
  const alreadyOpen = menu && menu.classList.contains('show');
  closeDropdowns();
  if (!alreadyOpen && menu) openMenu(menu, btn);
}
function closeDropdowns() { document.querySelectorAll('.dropdown-menu.show').forEach(closeMenu); }
// a fixed menu is positioned from viewport coordinates, so keep it glued to its trigger
function repositionOpenMenus() {
  document.querySelectorAll('.dropdown-menu.show').forEach(m => m._trigger ? positionMenu(m, m._trigger) : closeMenu(m));
}
document.addEventListener('click', (e) => {
  // an open menu may be parked in #menu-layer, so check for the menu itself too
  if (!e.target.closest('.dropdown') && !e.target.closest('.dropdown-menu')) closeDropdowns();
});
document.getElementById('ribbon')?.addEventListener('scroll', repositionOpenMenus, { passive: true });
window.addEventListener('resize', repositionOpenMenus);

  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');

  c.appendChild(t);
  setTimeout(() => { dismissToast(t); }, ttl || 3400);
}
// Play the exit animation, then remove. Falls back to an immediate remove when
// animations are off (the keyframe is neutralised, so nothing would ever fire).
function dismissToast(t) {
  if (!t || !t.parentNode) return;
  t.classList.add('leaving');
  let done = false;
  const remove = () => { if (!done) { done = true; t.remove(); } };
  t.addEventListener('animationend', remove, { once: true });
  setTimeout(remove, 400);
}

function showContextMenu(x, y) {
  const m = document.getElementById('context-menu');
  m.style.display = 'block';

    case 'shadow': img.style.border = ''; img.style.boxShadow = '0 8px 22px rgba(0,0,0,.55)'; img.style.borderRadius = ''; break;
    case 'round': img.style.border = ''; img.style.boxShadow = ''; img.style.borderRadius = '14px'; break;
  }
  saveUndo();
  showToast('Picture style applied', 'ok');
}
const WRAP_MODES = ['inline', 'square-right', 'square-left'];
function picWrap() {
  const img = requireImage(); if (!img) return;
  const cur = img.dataset.wrap || 'inline';
  const next = WRAP_MODES[(WRAP_MODES.indexOf(cur) + 1) % WRAP_MODES.length];
  img.dataset.wrap = next;
  img.style.display = next === 'inline' ? 'inline' : 'block';
  img.style.float = next === 'square-right' ? 'right' : next === 'square-left' ? 'left' : '';
  img.style.margin = next === 'inline' ? '8px 0' : '8px 12px';
  saveUndo();
  showToast('Text wrapping: ' + (next === 'inline' ? 'In Line with Text' : next === 'square-right' ? 'Square — right' : 'Square — left'), 'ok');
}
function picForward() {
  const img = requireImage(); if (!img) return;
  img.style.zIndex = (parseInt(img.style.zIndex) || 1) + 1;
  saveUndo(); showToast('Picture brought forward (layer ' + img.style.zIndex + ')', 'ok');
}
function picBackward() {
  const img = requireImage(); if (!img) return;
  img.style.zIndex = Math.max(0, (parseInt(img.style.zIndex) || 1) - 1);
  saveUndo(); showToast('Picture sent back (layer ' + img.style.zIndex + ')', 'ok');
}
function picAlign() {
  const img = requireImage(); if (!img) return;
  const modes = ['left', 'center', 'right'];
  const cur = modes.indexOf(img.dataset.align || 'left');
  const next = modes[(cur + 1) % 3];
  img.dataset.align = next;
  img.style.display = 'block';
  img.style.marginLeft = next === 'left' ? '0' : next === 'center' ? 'auto' : 'auto';
  img.style.marginRight = next === 'right' ? '0' : next === 'center' ? 'auto' : 'auto';
  saveUndo(); showToast('Aligned: ' + next, 'ok');
}
function picRotate() {
  const img = requireImage(); if (!img) return;
  const deg = ((parseInt(img.dataset.rot) || 0) + 90) % 360;
  img.dataset.rot = deg;
  const flipH = img.dataset.fliph === '1' ? ' scaleX(-1)' : '';
  img.style.transform = 'rotate(' + deg + 'deg)' + flipH;
  saveUndo(); showToast('Rotated to ' + deg + '°', 'ok');
}
function setPicSize(dim, val) {
  const img = requireImage(); if (!img) return;
  const px = Math.max(10, Math.min(4000, +val || 10));
  if (dim === 'h') { img.style.height = px + 'px'; img.style.width = 'auto'; img.style.maxWidth = '100%'; }
  else { img.style.width = px + 'px'; img.style.height = 'auto'; img.style.maxWidth = '100%'; }
  saveUndo();
}
function addPicAltText() {
  const img = requireImage(); if (!img) return;
  const t = prompt('Alt text (description for screen readers):', img.alt || '');
  if (t !== null) {
    img.alt = t;
    saveUndo();
    showToast(t ? 'Alt text saved' : 'Alt text cleared — this is an accessibility issue', t ? 'ok' : 'warn');
    runAccessibilityChecks('alt');
  }
}
function showSelectionPane() {
  const imgs = Array.from(editor.querySelectorAll('img'));
  let html = '';
  if (!imgs.length) html = '<p style="color:var(--text-2)">No pictures in the document.</p>';
  imgs.forEach((img, i) => {
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><img src="' + img.src.substring(0, 80) + '" style="width:36px;height:26px;object-fit:cover;border-radius:3px"><span style="flex:1;font-size:12px">Picture ' + (i + 1) + (img.alt ? ' — ' + img.alt.substring(0, 20) : ' <i>(no alt text)</i>') + '</span><button class="btn" onclick="selectPicture(' + i + ')">Select</button><button class="btn" onclick="deletePictureAt(' + i + ')">Delete</button></div>';
  });
  showModal('Selection Pane', html);
}
function selectPicture(i) { const img = editor.querySelectorAll('img')[i]; if (img) { __selImg = img; const r = document.createRange(); r.selectNode(img); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } closeModal(); }
function deletePictureAt(i) { const img = editor.querySelectorAll('img')[i]; if (img) { img.remove(); saveUndo(); updateStatus(); } closeModal(); showToast('Picture deleted', 'ok'); }
// Auto-show the contextual Picture Format tab when a picture is selected
document.addEventListener('selectionchange', () => {
  const tab = document.getElementById('tab-picture');
  if (!tab) return;
  const img = getSelectedImage();
  if (img) {
    __selImg = img;
    const h = document.getElementById('pic-height'), w = document.getElementById('pic-width');
    const rect = img.getBoundingClientRect();
    if (h && document.activeElement !== h) h.value = Math.round(rect.height) || '';
    if (w && document.activeElement !== w) w.value = Math.round(rect.width) || '';
    if (tab.style.display === 'none') {
      tab.style.display = 'flex';
      const active = document.querySelector('#ribbon-tabs .tab.active');
      if (!active || active.id !== 'tab-picture') switchTab(tab);
    }
  } else if (tab.style.display !== 'none') {
    tab.style.display = 'none';
    const active = document.querySelector('#ribbon-tabs .tab.active');
    if (active && active.id === 'tab-picture') {
      const home = document.querySelector('#ribbon-tabs .tab[data-panel="panel-home"]');
      if (home) switchTab(home);
    }
  }
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) hideMiniToolbar();
});

function showSortDialog() {
  showModal('Sort Text Ascending/Descending',
    '<p style="margin-bottom:6px">Sort by:</p><select id="sort-by" class="rselect" style="width:100%;height:30px"><option value="text">Text (paragraphs)</option></select>' +
    '<p style="margin:10px 0 6px">Order:</p><select id="sort-order" class="rselect" style="width:100%;height:30px"><option value="asc">Ascending (A to Z)</option><option value="desc">Descending (Z to A)</option></select>' +
    '<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="doSort()">OK</button></div>');
}
function doSort() {
  const order = document.getElementById('sort-order').value;
  const isPara = el => /^(P|H1|H2|H3|H4|H5|H6|LI)$/.test(el.tagName) && el.textContent.trim();
  const kids = Array.from(editor.children);
  const items = kids.filter(isPara);
  if (items.length < 2) { closeModal(); showToast('Not enough paragraphs to sort', 'warn'); return; }
  let lastIdx = -1;
  kids.forEach((el, i) => { if (isPara(el)) lastIdx = i; });
  const anchor = lastIdx < kids.length - 1 ? kids[lastIdx + 1] : null;
  const sorted = items.slice().sort((a, b) => {
    const r = a.textContent.trim().localeCompare(b.textContent.trim(), undefined, { sensitivity: 'base', numeric: true });
    return order === 'desc' ? -r : r;
  });
  items.forEach(el => el.remove());
  sorted.forEach(el => editor.insertBefore(el, anchor));
  saveUndo(); updateStatus(); closeModal();
  showToast('Sorted ' + items.length + ' paragraphs ' + (order === 'desc' ? 'Z \u2192 A' : 'A \u2192 Z'), 'ok');
}

function escUser(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function doInsertSignature() {
  const name = (document.getElementById('sig-name').value || 'Signer').trim();

  const html = '<div style="border-bottom:1px solid var(--text-2);width:260px;margin-top:44px;padding-bottom:4px;min-height:40px;color:inherit">' +
    '<div style="font-size:14pt;font-family:cursive">' + escUser(name) + '</div>' +
    '<div style="font-size:9pt;color:var(--text-2)">' + escUser(title) + '</div></div><p><br></p>';
  document.execCommand('insertHTML', false, html);
  saveUndo(); updateStatus();
  showToast('Signature line inserted', 'ok');
}
