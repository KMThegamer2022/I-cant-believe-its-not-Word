<script>
// ═══════════════ FIND / REPLACE ═══════════════
function showFind() { document.getElementById('find-replace-bar').style.display = 'block'; document.getElementById('find-input').focus(); }
function showReplace() { showFind(); }
function doFindNext() {
  const q = document.getElementById('find-input').value;
  if (!q) return;
  const found = window.find(q, false, document.getElementById('find-case').checked, false);
  document.getElementById('find-count').textContent = found ? 'Found' : 'Not found';
}
function doFindPrev() { /* basic: just search again */ doFindNext(); }
function doReplace() {
  const find = document.getElementById('find-input').value;
  const repl = document.getElementById('replace-input').value;
  const sel = window.getSelection();
  if (sel.toString().toLowerCase() === find.toLowerCase()) {
    sel.deleteContents();
    sel.insertNode(document.createTextNode(repl));
    saveUndo();
  } else { doFindNext(); }
}
function doReplaceAll() {
  const find = document.getElementById('find-input').value;
  const repl = document.getElementById('replace-input').value;
  if (!find) return;
  const esc = find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(esc, document.getElementById('find-case').checked ? 'g' : 'gi');
  let count = 0;
  const walk = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n => {
    if (re.test(n.textContent)) {
      const before = n.textContent;
      n.textContent = before.replace(re, () => { count++; return repl; });
      re.lastIndex = 0;
    }
  });
  document.getElementById('find-count').textContent = `Replaced ${count} occurrence${count!==1?'s':''}`;
  saveUndo(); updateStatus();
}
function showSelectMenu() {
  showModal('Select', `
    <button onclick="cmd('selectAll');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;cursor:pointer">Select All (Ctrl+A)</button>

    <button onclick="selectSimilarFormat();closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;cursor:pointer">Select Text with Similar Formatting</button>`);
}

// ═══════════════ DICTATION ═══════════════
let dictating = false, recognition = null;
function toggleDictate() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported in this browser. Try Chrome or Edge.'); return; }
  if (dictating) { recognition.stop(); dictating = false; return; }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (final) editor.focus(), document.execCommand('insertText', false, final);
  };
  recognition.start();
  dictating = true;
  alert('🎤 Dictation started. Speak now... Click OK when done to stop.');
  recognition.stop(); dictating = false;
}

// ═══════════════ EDITOR / PROOFING ═══════════════
function showEditorPanel() {
  const pane = document.getElementById('editor-pane');
  pane.style.display = 'flex'; pane.style.flexDirection = 'column';
  const text = editor.innerText;
  const words = text.trim() ? text.trim().split(/\s+/) : [];
  let issues = 0, html = '';
  // Basic spell check
  const misspelled = [];
  words.forEach(w => {
    const clean = w.replace(/[^a-zA-Z']/g, '');
    if (clean.length > 3 && !COMMON_WORDS.has(clean.toLowerCase())) {
      issues++;
      misspelled.push(clean);
    }
  });
  html += `<div style="margin-bottom:12px"><b>Editor Score:</b> <span style="color:${issues>5?'#c00':issues>0?'#f5a623':'#2e7d32'};font-size:16pt;font-weight:700">${Math.max(0, 100 - issues * 3)}%</span></div>`;
  html += `<p style="color:#666;margin-bottom:8px">${words.length} words, ${issues} potential issues</p>`;
  if (misspelled.length) {
    html += `<b>Suggestions:</b><ul style="padding-left:16px;margin-top:4px">`;
    misspelled.slice(0, 10).forEach(w => { html += `<li style="margin:4px 0;color:#c00">${w}</li>`; });
    html += '</ul>';
  } else {
    html += '<p style="color:#2e7d32">&#10003; No major issues found!</p>';
  }
  document.getElementById('editor-results').innerHTML = html;
}

function readAloud() {

  if (!sel.trim()) return;

// ═══════════════ COMMENTS ═══════════════
let comments = [], commentIdx = -1;
function addComment() {
  const sel = window.getSelection().toString() || 'General comment';
  const text = prompt('Add a comment:');
  if (!text) return;
  comments.push({ text, quote: sel, resolved: false });
  renderComments();
  document.getElementById('comments-pane').style.display = 'block';
}
function renderComments() {
  const el = document.getElementById('comments-list');
  el.innerHTML = comments.map((c, i) => `
    <div style="background:var(--panel-bg2);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;${c.resolved?'opacity:.5':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <b style="font-size:12px">User</b>
        <span style="font-size:10px;color:var(--text-2)">${new Date().toLocaleTimeString()}</span>
      </div>
      ${c.quote ? `<p style="font-size:11px;color:var(--text-2);border-left:2px solid var(--blue);padding-left:6px;margin-bottom:4px">"${c.quote}"</p>` : ''}
      <p style="font-size:12px">${c.text}</p>
      <div style="margin-top:6px">
        <button onclick="comments[${i}].resolved=!comments[${i}].resolved;renderComments()" style="font-size:11px;color:var(--blue-light);cursor:pointer">${c.resolved ? 'Unresolve' : 'Resolve'}</button>
        <button onclick="comments.splice(${i},1);renderComments()" style="font-size:11px;color:var(--danger);cursor:pointer;margin-left:8px">Delete</button>
      </div>
    </div>`).join('') || '<p style="color:var(--text-2);font-size:11px">No comments yet.</p>';
}
function deleteComment() { if (comments.length) { comments.pop(); renderComments(); } }
function prevComment() { if (commentIdx > 0) commentIdx--; }
function nextComment() { if (commentIdx < comments.length - 1) commentIdx++; }
function resolveComment() { if (commentIdx >= 0 && comments[commentIdx]) { comments[commentIdx].resolved = true; renderComments(); } }

let macros = [];
function recordMacro() {
  const name = prompt('Macro name:', 'Macro' + (macros.length + 1));
  if (!name) return;
  alert('Recording macro "' + name + '". Perform actions, then stop recording.');
  macros.push({ name, steps: [] });
  setTimeout(() => alert('Macro recording stopped.'), 5000);
}
function createMacro() {
  const name = document.getElementById('macro-name').value;
  if (!name) return;
  const code = prompt('Enter macro code:\nAvailable commands: bold, italic, underline, insertText(text), applyStyle(name)');
  if (!code) return;
  macros.push({ name, code });
  closeModal();
}
function runMacro() {
  const name = document.getElementById('macro-name')?.value;
  const m = macros.find(x => x.name === name);
  if (!m) { alert('Macro not found.'); return; }
  try {
    if (m.code) {
      const fn = new Function('cmd','editor','alert', m.code);
      fn(cmd, editor, alert);
    }
  } catch(e) { alert('Macro error: ' + e.message); }
  closeModal();
}

// ═══════════════ DRAW ═══════════════
let drawing = false, drawMode = false, currentPen = 'pen', strokes = [];
function setPen(p) {
  currentPen = p;
  ensureInkCanvas();
  if (!drawMode) toggleDrawMode();
}
// The ink canvas lives inside #editor-page so ink is clipped to the page, but any
// editor.innerHTML assignment (new/open/import) destroys it. Recreate on demand.
function ensureInkCanvas() {
  var page = document.getElementById('editor-page');
  var canvas = document.getElementById('ink-canvas');
  if (canvas && canvas.parentNode === page) return canvas;
  if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
  canvas = document.createElement('canvas');
  canvas.id = 'ink-canvas';
  canvas.style.display = 'none';
  page.appendChild(canvas);
  return canvas;
}
function toggleDrawMode() {
  drawMode = !drawMode;
  var btn = document.getElementById('btn-drawmode');
  if (btn) btn.classList.toggle('active', drawMode);
  var canvas = ensureInkCanvas();
  var page = document.getElementById('editor-page');
  if (drawMode) {
    // Canvas is inside editor-page, so position at 0,0 relative to page
    canvas.width = page.offsetWidth;
    canvas.height = page.offsetHeight;
    canvas.style.display = 'block';
    canvas.style.position = 'absolute';
    canvas.style.left = '0';
    canvas.style.top = '0';
    canvas.style.width = page.offsetWidth + 'px';
    canvas.style.height = page.offsetHeight + 'px';
    canvas.style.pointerEvents = 'auto';
    canvas.style.cursor = 'crosshair';
    canvas.style.zIndex = '50';
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', doDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', doDraw);
    canvas.addEventListener('touchend', endDraw);
    // Show visual indicator
    showDrawIndicator(true);
    // Listen for Escape to exit
    document.addEventListener('keydown', drawEscapeHandler);
  } else {
    canvas.style.display = 'none';
    canvas.style.pointerEvents = 'none';
    canvas.removeEventListener('mousedown', startDraw);
    canvas.removeEventListener('mousemove', doDraw);
    canvas.removeEventListener('mouseup', endDraw);
    canvas.removeEventListener('mouseleave', endDraw);
    canvas.removeEventListener('touchstart', startDraw);
    canvas.removeEventListener('touchmove', doDraw);
    canvas.removeEventListener('touchend', endDraw);
    showDrawIndicator(false);
    document.removeEventListener('keydown', drawEscapeHandler);
  }
}
function drawEscapeHandler(e) {
  if (e.key === 'Escape' && drawMode) toggleDrawMode();
}
function showDrawIndicator(on) {
  var ind = document.getElementById('draw-indicator');
  if (on) {
    if (!ind) {
      ind = document.createElement('div');
      ind.id = 'draw-indicator';
      ind.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;z-index:9999;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3)';
      ind.textContent = '✏️ Drawing mode — press Esc or click "Draw on Page" to stop';
      document.body.appendChild(ind);
    }
  } else if (ind) ind.remove();
}
function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const canvas = ensureInkCanvas();
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  strokes.push([{ x, y, color: document.getElementById('pen-color').value, size: document.getElementById('pen-size').value, type: currentPen }]);
}
function doDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const canvas = ensureInkCanvas();
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const stroke = strokes[strokes.length - 1];
  const prev = stroke[stroke.length - 1];
  ctx.strokeStyle = stroke[0].color;
  ctx.lineWidth = stroke[0].size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (stroke[0].type === 'highlighter') { ctx.globalAlpha = 0.3; ctx.lineWidth = parseInt(stroke[0].size) * 3; }
  else ctx.globalAlpha = 1;
  if (stroke[0].type === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 20;
  }
  ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  stroke.push({ x, y });
}
function endDraw() { drawing = false; }
function clearInk() {
  const canvas = ensureInkCanvas();
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  strokes = [];
}

function inkToMath() { alert('Ink to Math: Draw a mathematical equation and it will be converted to typed LaTeX.'); }

  const themes = {
    default: { heading: '#2b579a', accent: '#4a90d9' },
    blue: { heading: '#1565c0', accent: '#42a5f5' },
    dark: { heading: '#222', accent: '#555' },
    green: { heading: '#2e7d32', accent: '#66bb6a' },
    red: { heading: '#c62828', accent: '#ef5350' }
  };
  const th = themes[t] || themes.default;
  editor.querySelectorAll('p').forEach(p => {
    const fs = parseInt(getComputedStyle(p).fontSize);
    if (fs > 14) p.style.color = th.heading;
  });
  editor.style.setProperty('--accent', th.accent);
}

      <button onclick="setPageBorder('none')" style="padding:8px 16px;border:1px solid #ddd;border-radius:4px;cursor:pointer">None</button>

// ═══════════════ ACCESSIBILITY ASSISTANT ═══════════════
let accessIssues = [];
function toggleAccessibilityPane(forceOpen) {
  const p = document.getElementById('access-pane');
  const open = forceOpen === true || p.style.display !== 'flex';
  p.style.display = open ? 'flex' : 'none';
  if (open && document.getElementById('access-results').innerHTML === '') runAccessibilityChecks();

function relLum(rgb) {
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
function parseColor(str) {
  if (!str) return null;
  const m = str.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const parts = m[1].split(',').map(s => parseFloat(s));
  if (parts.length > 3 && parts[3] === 0) return null;
  return [parts[0], parts[1], parts[2]];
}
function contrastRatio(a, b) {
  const la = relLum(a), lb = relLum(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function runAccessibilityChecks(scope) {

    if (scope && scope !== cat) return;
    accessIssues.push({ cat, title, desc, fixLabel, fn });
  };
  // 1. Alt text
  if (!scope || scope === 'alt') {
    editor.querySelectorAll('img').forEach((img, i) => {
      if (!img.alt) add('alt', 'Image missing alt text', 'Screen readers cannot describe picture #' + (i + 1) + '.', 'Add alt text', () => {
        const t = prompt('Describe this picture (alt text):');
        if (t !== null) { img.alt = t; saveUndo(); }
      });
    });
  }
  // 2. Colour contrast
  if (!scope || scope === 'contrast') {
    const pageBg = parseColor(getComputedStyle(editor).backgroundColor) || [255, 255, 255];
    const seen = new Set();
    editor.querySelectorAll('p,h1,h2,h3,h4,li,td,span,em,strong,b,i').forEach(el => {
      if (!el.textContent.trim() || seen.has(el)) return;
      const col = parseColor(getComputedStyle(el).color);
      if (!col) return;
      const ratio = contrastRatio(col, pageBg);
      const smallText = parseFloat(getComputedStyle(el).fontSize) < 18;

    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+S</b></td><td style="border-bottom:1px solid var(--border)">Save</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+Z / Ctrl+Y</b></td><td style="border-bottom:1px solid var(--border)">Undo / Redo</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+B / I / U</b></td><td style="border-bottom:1px solid var(--border)">Bold / Italic / Underline</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+F / Ctrl+H</b></td><td style="border-bottom:1px solid var(--border)">Find / Replace</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+K</b></td><td style="border-bottom:1px solid var(--border)">Insert link</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+P</b></td><td style="border-bottom:1px solid var(--border)">Print / PDF</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+Shift++</b> <span style="color:var(--text-2)">(Mac: &#8984;&#8679;+)</span></td><td style="border-bottom:1px solid var(--border)">Superscript</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Ctrl+Shift+-</b> <span style="color:var(--text-2)">(Mac: &#8984;&#8679;-)</span></td><td style="border-bottom:1px solid var(--border)">Subscript</td></tr>' +
    '<tr><td style="padding:5px 4px;border-bottom:1px solid var(--border)"><b>Esc</b></td><td style="border-bottom:1px solid var(--border)">Exit drawing mode / close menus</td></tr>' +
    '<tr><td style="padding:5px 4px"><b>Ctrl+Alt+1/2/3</b></td><td>Heading 1 / 2 / 3</td></tr></table>');
}
// ═══════════════ DRAW: quick exit ═══════════════
function stopDrawing() { if (typeof drawMode !== 'undefined' && drawMode) toggleDrawMode(); else showToast('Draw mode is off', 'warn'); }

// ═══════════════ SORT / ADD-INS / SIGNATURE ═══════════════
function showSortDialog() {
  showModal('Sort Text Ascending/Descending',
    '<p style="margin-bottom:6px">Sort by:</p><select id="sort-by" class="rselect" style="width:100%;height:30px"><option value="text">Text (paragraphs)</option></select>' +
    '<p style="margin:10px 0 6px">Order:</p><select id="sort-order" class="rselect" style="width:100%;height:30px"><option value="asc">Ascending (A to Z)</option><option value="desc">Descending (Z to A)</option></select>' +
    '<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="doSort()">OK</button></div>');
}
function doSort() {
  const order = document.getElementById('sort-order').value;
  const isPara = el => /^(P|H1|H2|H3|H4|H5|H6|LI)$/.test(el.tagName) && el.textContent.trim();
  const kids = Array.from(editor.children);
  const items = kids.filter(isPara);
  if (items.length < 2) { closeModal(); showToast('Not enough paragraphs to sort', 'warn'); return; }
  let lastIdx = -1;
  kids.forEach((el, i) => { if (isPara(el)) lastIdx = i; });
  const anchor = lastIdx < kids.length - 1 ? kids[lastIdx + 1] : null;
  const sorted = items.slice().sort((a, b) => {
    const r = a.textContent.trim().localeCompare(b.textContent.trim(), undefined, { sensitivity: 'base', numeric: true });
    return order === 'desc' ? -r : r;
  });
  items.forEach(el => el.remove());
  sorted.forEach(el => editor.insertBefore(el, anchor));
  saveUndo(); updateStatus(); closeModal();
  showToast('Sorted ' + items.length + ' paragraphs ' + (order === 'desc' ? 'Z \u2192 A' : 'A \u2192 Z'), 'ok');
}
function showAddins() {
  showModal('Add-ins',
    '<p style="margin-bottom:8px">There is no Office Add-in store in a single HTML file — but macros come close.</p>' +
    '<p style="margin-bottom:12px;color:var(--text-2)">Add-in store is unavailable offline. You can record and run simple macros instead.</p>' +
    '<div style="display:flex;gap:8px"><button class="btn" onclick="closeModal();showMacros()">Open Macros</button>' +
    '<button class="btn" onclick="closeModal()">Close</button></div>');
}
function escUser(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function insertSignatureLine() {
  showModal('Signature Line',
    '<p style="margin-bottom:6px">Signer name:</p><input type="text" id="sig-name" class="rselect" style="width:100%;height:30px" placeholder="Full name">' +
    '<p style="margin:10px 0 6px">Title:</p><input type="text" id="sig-title" class="rselect" style="width:100%;height:30px" placeholder="Job title">' +
    '<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="doInsertSignature()">Insert</button></div>');
}
function doInsertSignature() {
  const name = (document.getElementById('sig-name').value || 'Signer').trim();
  const title = (document.getElementById('sig-title').value || '').trim();
  closeModal();
  editor.focus();
  const html = '<div style="border-bottom:1px solid var(--text-2);width:260px;margin-top:44px;padding-bottom:4px;min-height:40px;color:inherit">' +
    '<div style="font-size:14pt;font-family:cursive">' + escUser(name) + '</div>' +
    '<div style="font-size:9pt;color:var(--text-2)">' + escUser(title) + '</div></div><p><br></p>';
  document.execCommand('insertHTML', false, html);
  saveUndo(); updateStatus();
  showToast('Signature line inserted', 'ok');
}
</script>
