<script>
// ════════════════════════════════════════════════════════════════════════════

// ═══════ DICTIONARY / SPELL ENGINE ═══════
let DICT_CUSTOM = new Set(), DICT_IGNORE = new Set();

  teh: 'the', accomodate: 'accommodate', recieve: 'receive', seperate: 'separate',
  definately: 'definitely', occurence: 'occurrence', embarass: 'embarrass',
  librery: 'library', februrary: 'february', goverment: 'government'

function loadDict() {

}

}
function isKnown(w) { const l = w.toLowerCase(); return COMMON_WORDS.has(l) || DICT_CUSTOM.has(l) || DICT_IGNORE.has(l); }
function addToDictionary(w) { if (!w) return; DICT_CUSTOM.add(w.toLowerCase()); DICT_IGNORE.delete(w.toLowerCase()); saveDict(); showToast('Added "' + w + '" to dictionary', 'ok'); try { markSpellingErrors(); showEditorPanel(); } catch (e) {} }
function ignoreWord(w, scope) { if (!w) return; if (scope === 'all') DICT_IGNORE.add(w.toLowerCase()); saveDict(); try { markSpellingErrors(); showEditorPanel(); } catch (e) {} hideContextMenu(); }
function edits1(w) {

  const rep = [], ins = [];
  splits.forEach(s => { if (s[1]) lc.forEach(c => rep.push(s[0] + c + s[1].slice(1))); lc.forEach(c => ins.push(s[0] + c + s[1])); });

// Damerau-Levenshtein distance (adjacent transposition counts as one edit).

  // affordable for short words — long ones get their (usually sufficient) edit-1 hits

// Place the caret `offset` characters into the given root nodes. Used to follow the caret

// ═══════ AUTOCORRECT RULES ═══════
let AC_RULES = [
  { find: '(c)', replace: '©', formatted: false },
  { find: '(r)', replace: '®', formatted: false },
  { find: '(tm)', replace: '™', formatted: false },
  { find: 'teh', replace: 'the', formatted: false },
  { find: 'recieve', replace: 'receive', formatted: false },
  { find: 'seperate', replace: 'separate', formatted: false },
  { find: 'definately', replace: 'definitely', formatted: false },
  { find: 'occurence', replace: 'occurrence', formatted: false },
  { find: 'accomodate', replace: 'accommodate', formatted: false },
  { find: 'embarass', replace: 'embarrass', formatted: false }
];
let AC_EXC = { firstLetter: ['e.g.', 'etc.', 'approx.', 'vs.', 'inc.', 'ltd.', 'no.'], initialCaps: ['IDs', 'GHz', 'PhD', 'McAfee'], other: [] };
let AC_SET = {
  enabled: true, showSmartButton: true, twoInitialCaps: true, sentenceCase: true,
  tableCellCaps: true, dayNames: true, capsLock: true, replaceAsYouType: true, autoSuggest: true
};
function loadAC() {
  try {
    const s = JSON.parse(localStorage.getItem('icbimw-ac') || 'null');
    if (s) AC_SET = Object.assign({}, AC_SET, s);
    const r = JSON.parse(localStorage.getItem('icbimw-ac-rules') || 'null');
    if (r) AC_RULES = r;
    const e = JSON.parse(localStorage.getItem('icbimw-ac-exc') || 'null');
    if (e) AC_EXC = Object.assign({ firstLetter: [], initialCaps: [], other: [] }, e);
  } catch (e) {}
}
function saveAC() {
  try { localStorage.setItem('icbimw-ac', JSON.stringify(AC_SET)); localStorage.setItem('icbimw-ac-rules', JSON.stringify(AC_RULES)); localStorage.setItem('icbimw-ac-exc', JSON.stringify(AC_EXC)); } catch (e) {}
}
function isFirstLetterExc(w) { return AC_EXC.firstLetter.some(x => w.toLowerCase() === x.toLowerCase()); }
function isInitialCapsExc(w) { return AC_EXC.initialCaps.some(x => w === x); }

  if (w.length < 3) return null;
  if (/^[A-Z]{2}[a-z]/.test(w) && !isInitialCapsExc(w)) return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();

}

}

  if (isOtherCorrectionExc(w)) return null;

// Apply autocorrect to a completed word. Returns replacement string or null.
function autocorrectWord(word, prevChar, nextChar) {
  if (!AC_SET.enabled || !word || word.length < 2 || isOtherCorrectionExc(word)) return null;
  let l = word.toLowerCase();

  if (AC_SET.twoInitialCaps) { const f = fixTwoInitialCaps(word); if (f) return f; }

  if (AC_SET.dayNames) { const f = fixDayName(word); if (f) return f; }

  if (AC_SET.capsLock) { const f = fixCapsLock(word); if (f) return f; }

  if (AC_SET.replaceAsYouType) { const f = replaceAsYouType(word); if (f) return f; }

// ═══════ HANDLE AUTOCORRECT AS YOU TYPE ═══════
let acTyping = false;
function handleAutoCorrectOnInput() {
  if (acTyping || !AC_SET.enabled) return;
  acTyping = true;
  setTimeout(() => {
    acTyping = false;
    try { doAutoCorrectReplace(); } catch (e) {}
  }, 120);
}
function doAutoCorrectReplace() {
  const sel = window.getSelection(); if (!sel.rangeCount || !sel.isCollapsed) return;

  let probe = endOff;
  while (probe > 0 && !/[A-Za-z0-9']/.test(text[probe - 1])) probe--;
  let wordStart = probe;
  while (wordStart > 0 && /[A-Za-z0-9']/.test(text[wordStart - 1])) wordStart--;

  if (!word || word.length < 2) return;

  if (probe < text.length && !/\s/.test(text[probe])) return;

  const replacement = autocorrectWord(word, prevChar, text[probe] || '');
  if (!replacement) return;
  const r = document.createRange(); r.setStart(start, wordStart); r.setEnd(start, probe);
  sel.removeAllRanges(); sel.addRange(r);
  document.execCommand('insertText', false, replacement);

let smartBtnTimer = null;
function showAutoCorrectSmartButton(orig, repl) {
  if (smartBtnTimer) clearTimeout(smartBtnTimer);
  const btn = document.getElementById('ac-smart-btn');
  if (!btn) {
    const b = document.createElement('button');
    b.id = 'ac-smart-btn';
    b.style.cssText = 'position:fixed;background:#fff;border:1px solid #999;border-radius:12px;padding:4px 10px;font-size:12px;color:#111;z-index:10000;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;pointer-events:auto';
    b.onclick = (e) => { e.stopPropagation(); undoLastAC(); hideSmartBtn(); };
    b.title = 'Undo AutoCorrect / stop rule';

  btn.textContent = orig + ' → ' + repl + '  ↶';

function hideSmartBtn() { const b = document.getElementById('ac-smart-btn'); if (b) b.style.display = 'none'; }

// ═══════ SENTENCE CASE & TABLE CELL CAPS (on terminal punctuation / cell entry) ═══════
function capitalizeSentenceAfter(text, pos) {
  // pos is index of terminal punctuation . ! ?
  let i = pos + 1;
  while (i < text.length && /\s/.test(text[i])) i++;
  if (i < text.length && /[a-z]/.test(text[i])) return { at: i, to: text[i].toUpperCase() };
  return null;
}
// Triggered when user types . ! ? followed by a letter — handled in handleAutoCorrectOnInput via word boundaries is weak;
// instead handle on keydown for terminal punctuation + space below.

// ═══════ MATH AUTOCORRECT ═══════
const MATH_MAP = {
  '\\alpha':'α','\\beta':'β','\\gamma':'γ','\\delta':'δ','\\epsilon':'ε','\\zeta':'ζ','\\eta':'η','\\theta':'θ','\\iota':'ι','\\kappa':'κ','\\lambda':'λ','\\mu':'μ','\\nu':'ν','\\xi':'ξ','\\omicron':'ο','\\pi':'π','\\rho':'ρ','\\sigma':'σ','\\tau':'τ','\\upsilon':'υ','\\phi':'φ','\\chi':'χ','\\psi':'ψ','\\omega':'ω','\\Omega':'Ω',
  '\\pm':'±','\\mp':'∓','\\times':'×','\\div':'÷','\\cdot':'⋅','\\infty':'∞','\\approx':'≈','\\neq':'≠','\\leq':'≤','\\geq':'≥','\\lt':'<','\\gt':'>',
  '\\sum':'∑','\\prod':'∏','\\int':'∫','\\partial':'∂','\\nabla':'∇','\\in':'∈','\\notin':'∉','\\subset':'⊂','\\subseteq':'⊆','\\cup':'∪','\\cap':'∩','\\emptyset':'∅',
  '\\rightarrow':'→','\\leftarrow':'←','\\Rightarrow':'⇒','\\Leftrightarrow':'⇔','\\forall':'∀','\\exists':'∃','\\neg':'¬','\\land':'∧','\\lor':'∨',
  '\\pi':'π','\\degree':'°','\\frac':'','\\sqrt':'√'

function convertMath(tok) {
  if (AC_SET.mathOutside !== false && tok) {
    const r = MATH_MAP[tok];
    if (r !== undefined) return r;
  }
  return null;
}
function handleMathOnSpace() {
  if (!AC_SET.mathOutside) return;
  const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
  const start = sel.getRangeAt(0).startContainer;
  if (start.nodeType !== 3) return;
  const text = start.textContent; const off = sel.getRangeAt(0).startOffset;
  let wordStart = off;
  while (wordStart > 0 && /[A-Za-z\\]/.test(text[wordStart - 1])) wordStart--;
  const tok = text.slice(wordStart, off);
  if (!tok.startsWith('\\') || tok.length < 2) return;
  const sym = convertMath(tok);
  if (!sym) return;

  sel.removeAllRanges(); sel.addRange(r);

// ═══════ AUTOFORMAT AS YOU TYPE ═══════
let AF_SET = {
  smartQuotes: true, fractions: true, markdown: true, hyperlinks: true, ordinals: true,
  hyphens: true, autoBullets: true, autoNumbered: true, borderLines: true, textTables: true,
  headingStyles: true, formatListItem: true, tabIndent: true, defineStyles: true

const SMART_OPEN = '“', SMART_CLOSE = '”', SMART_OPEN_S = '‘', SMART_CLOSE_S = '’';
let quoteOpen = true;
function autoFormatOnType() {
  if (!AF_SET.smartQuotes && !AF_SET.fractions && !AF_SET.markdown && !AF_SET.hyperlinks && !AF_SET.ordinals && !AF_SET.hyphens && !AF_SET.autoBullets && !AF_SET.autoNumbered && !AF_SET.borderLines && !AF_SET.textTables && !AF_SET.headingStyles) return;
  const sel = window.getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
  const start = sel.getRangeAt(0).startContainer;
  if (start.nodeType !== 3) return;
  const text = start.textContent; const off = sel.getRangeAt(0).startOffset;
  // look at the line/paragraph text before caret
  let lineStart = off;
  while (lineStart > 0 && text[lineStart - 1] !== '\n') lineStart--;
  const line = text.slice(lineStart, off);
  // --- border lines: --- === ___ then Enter handled on keydown, skip here
  // --- smart quotes
  if (AF_SET.smartQuotes) {
    // replace trailing straight quotes
    if (line.endsWith('"')) {
      const q = quoteOpen ? SMART_OPEN : SMART_CLOSE;
      quoteOpen = !quoteOpen;
      applyTrailingReplace(start, off, '"', q);

      const q = /[\w]$/.test(line.slice(0, -1)) ? SMART_CLOSE_S : SMART_OPEN_S;
      applyTrailingReplace(start, off, "'", q);
    }
  }
  // --- fractions
  if (AF_SET.fractions) {
    const m = line.match(/(\d+)\/(\d+)$/);
    if (m) {
      const frac = { '1/2':'½','1/4':'¼','3/4':'¾','1/3':'⅓','2/3':'⅔' }[m[1] + '/' + m[2]];
      if (frac) applyTrailingReplace(start, off, m[0], frac);
    }
  }
  // --- ordinals
  if (AF_SET.ordinals) {
    const m = line.match(/(\d+)(st|nd|rd|th)$/);
    if (m) {
      const sup = { st:'ˢᵗ', nd:'ⁿᵈ', rd:'ʳᵈ', th:'ᵗʰ' }[m[2]];
      if (sup) applyTrailingReplace(start, off, m[2], sup);
    }
  }

  if (AF_SET.hyphens) {
    if (line.endsWith('---')) { applyTrailingReplace(start, off, '---', '—'); }
    else if (line.endsWith('--')) { applyTrailingReplace(start, off, '--', '–'); }
  }
  // --- markdown bold *...* / **...**
  if (AF_SET.markdown) {
    const m = line.match(/\*\*([^*]+)\*\*$/);
    if (m) { applyTrailingReplaceStartEnd(start, off, m[0], '<b>' + m[1] + '</b>', true); return; }
    const m2 = line.match(/\*([^*]+)\*$/);
    if (m2 && !m2[1].includes(' ')) { applyTrailingReplaceStartEnd(start, off, m2[0], '<i>' + m2[1] + '</i>', true); return; }
  }

  if (AF_SET.hyperlinks) {
    const m = line.match(/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)$/);
    if (m) {
      const url = m[0];
      applyTrailingReplaceStartEnd(start, off, url, '<a href="' + (url.startsWith('www') ? 'http://' + url : url) + '" target="_blank">' + url + '</a>', true);

}
function applyTrailingReplace(node, off, oldTxt, newTxt) {
  const r = document.createRange(); r.setStart(node, off - oldTxt.length); r.setEnd(node, off);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  document.execCommand('insertText', false, newTxt);
  saveUndo(); updateStatus();
}
function applyTrailingReplaceStartEnd(node, off, oldTxt, newHtml, isHtml) {
  const r = document.createRange(); r.setStart(node, off - oldTxt.length); r.setEnd(node, off);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  if (isHtml) document.execCommand('insertHTML', false, newHtml);
  else document.execCommand('insertText', false, newHtml);
  saveUndo(); updateStatus();
}

// AutoFormat As You Type structural triggers handled on keydown (Enter/Space/Tab)

  while (lineStart > 0 && text[lineStart - 1] !== '\n') lineStart--;

  let handled = false;
  if (e.key === 'Enter') {

    if (AF_SET.borderLines && (/^---+$/.test(line) || /^===+$/.test(line) || /^\*\*\*+$/.test(line) || /^___+$/.test(line))) {
      e.preventDefault();

      replaceLineWith(start, lineStart, off, '<hr style="border:none;border-top:1px solid #000;margin:12px 0">');
      handled = true;
    }

    if (!handled && AF_SET.textTables && /^\+[-: ]+\+([-: ]+\+)+$/.test(line)) {
      e.preventDefault();
      const tableHtml = buildTableFromLine(line);
      replaceLineWith(start, lineStart, off, tableHtml + '<p><br></p>');
      handled = true;
    }
    // auto lists
    if (!handled && AF_SET.autoBullets && /^[\*\-\–]\s$/.test(line.trim())) {
      e.preventDefault();
      replaceLineWith(start, lineStart, off, '<ul><li></li></ul><p><br></p>');
      const li = editor.querySelector('li'); if (li) { const r = document.createRange(); r.selectNodeContents(li); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); editor.focus(); }
      handled = true;
    }
    if (!handled && AF_SET.autoNumbered && /^(\d+)\.\s$/.test(line.trim())) {
      e.preventDefault();
      replaceLineWith(start, lineStart, off, '<ol><li></li></ol><p><br></p>');
      handled = true;
    }
    // heading styles
    if (!handled && AF_SET.headingStyles) {
      const m = line.match(/^(#{1,3})\s+$/);
      if (m) {
        e.preventDefault();
        const tag = 'h' + m[1].length;
        replaceLineWith(start, lineStart, off, '<' + tag + '></' + tag + '><p><br></p>');
        handled = true;
      }
    }
  } else if (e.key === 'Tab' || e.key === 'Backspace') {
    if (AF_SET.tabIndent && e.key === 'Tab') { /* leave to default; indentation handled by browser */ }
  }
  return handled;
}
function replaceLineWith(node, lineStart, off, html) {
  const r = document.createRange(); r.setStart(node, lineStart); r.setEnd(node, off);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  document.execCommand('insertHTML', false, html);
  saveUndo(); updateStatus();
}
function buildTableFromLine(line) {
  const cells = line.split('+').filter(Boolean);
  const cols = cells.length;
  let html = '<table style="border-collapse:collapse;width:100%;margin:8px 0"><tr>';
  for (let i = 0; i < cols; i++) html += '<td style="border:1px solid #999;padding:6px;min-width:60px;min-height:24px"><br></td>';
  html += '</tr><tr>';
  for (let i = 0; i < cols; i++) html += '<td style="border:1px solid #999;padding:6px;min-width:60px;min-height:24px"><br></td>';
  html += '</tr></table>';
  return html;
}

// ═══════ DOCUMENT-WIDE AUTOFORMAT ═══════
function autoFormatDocument() {
  if (!confirm('Apply AutoFormat to the whole document? This cannot be undone with a single click (use Undo).')) return;
  const walk = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walk.nextNode())) nodes.push(n);
  nodes.forEach(node => {
    let t = node.textContent;
    if (AF_SET.smartQuotes) { t = t.replace(/"/g, quoteOpen ? '“' : '”'); quoteOpen = !quoteOpen; } // rough
    if (AF_SET.fractions) t = t.replace(/\b(\d)\/(\d)\b/g, (m,a,b) => { const f={'1/2':'½','1/4':'¼','3/4':'¾'}[a+'/'+b]; return f||m; });
    if (AF_SET.ordinals) t = t.replace(/\b(\d+)(st|nd|rd|th)\b/g, (m,n,s) => n + {'st':'ˢᵗ','nd':'ⁿᵈ','rd':'ʳᵈ','th':'ᵗʰ'}[s]);
    if (AF_SET.hyphens) t = t.replace(/---/g,'—').replace(/--/g,'–');
    if (AF_SET.hyperlinks) t = t.replace(/\b(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank">$1</a>');
    if (t !== node.textContent) {
      const frag = document.createRange(); frag.selectNodeContents(node);
      node.replaceWith(frag.createContextualFragment(t));
    }
  });
  saveUndo(); updateStatus();
  showToast('AutoFormat applied to document', 'ok');
}

// ═══════ ACTIONS / SMART TAGS ═══════
const ACTIONS_SET = { enabled: true };
function detectSmartTags(text) {
  const tags = [];
  // dates
  const dateRe = /\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}|(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* \d{1,2}(st|nd|rd|th)?,? \d{4})/gi;
  text.replace(dateRe, (m) => tags.push({ kind: 'Date', text: m, actions: ['Create calendar event', 'Add to calendar'] }));
  // emails
  text.replace(/\b[\w.+-]+@[\w-]+\.[\w.-]+\b/g, (m) => tags.push({ kind: 'Email', text: m, actions: ['Send email', 'Add to contacts'] }));
  // phones (rough)
  text.replace(/\b\d{3}[\-\.]?\d{3}[\-\.]?\d{4}\b/g, (m) => tags.push({ kind: 'Phone', text: m, actions: ['Call', 'Add to contacts'] }));
  return tags;
}
function showActionsMenu(word, x, y) {
  const tags = detectSmartTags(word);
  if (!tags.length) return false;
  const m = document.getElementById('context-menu');
  // build actions list
  let html = '';
  tags.forEach(t => {
    t.actions.forEach(a => {
      html += `<div class="actions-item" onclick="doAction('${jsEsc(t.text)}','${jsEsc(a)}')"><span class="ai-kind">${t.kind}</span>${t.text} → ${a}</div>`;

  document.getElementById('cm-actions-head').style.display = 'block';

  // reposition context menu already done by caller; we just reveal
  return true;
}
function hideActionsMenu() {

}

// ═══════ CONTEXT MENU INTEGRATION (spell) ═══════
function cmSpellAction(act) {
  const word = cmSpellWord;
  if (act === 'ignoreOnce') { hideContextMenu(); showToast('Ignored "' + word + '" once', 'ok'); return; }
  if (act === 'ignoreAll') { ignoreWord(word, 'all'); return; }
  if (act === 'addDict') { addToDictionary(word); return; }
  if (act === 'addAc') { AC_RULES.push({ find: word, replace: '', formatted: false }); saveAC(); hideContextMenu(); showToast('Added "' + word + '" to AutoCorrect (set replacement in dialog)', 'ok'); return; }
}
function getWordAtSelection() {
  const sel = window.getSelection(); if (!sel.rangeCount) return null;
  const range = sel.getRangeAt(0); let node = range.startContainer, off = range.startOffset;
  // flagged words are wrapped in <span class="icw-spell">, so selecting one can leave the
  // caret on that element instead of on a text node — descend when it holds exactly one
  if (node && node.nodeType === 1) {
    const texts = [...node.childNodes].filter(c => c.nodeType === 3);
    if (texts.length !== 1) return null;
    node = texts[0]; off = 0;
  }
  if (!node || node.nodeType !== 3) return null;
  const text = node.textContent; let st = Math.min(off, text.length), en = st;
  while (st > 0 && /[A-Za-z']/.test(text[st - 1])) st--;
  while (en < text.length && /[A-Za-z']/.test(text[en])) en++;
  const w = text.slice(st, en);
  return w.length >= 3 ? w : null;
}

// ═══════ COLOR PALETTE PICKERS (Font Color & Highlighter) ═══════
// Theme colours mirror Word's default palette (background/text 1-2 + six accents).
const THEME_COLORS = [
  { name: 'Background 1', hex: '#ffffff' },
  { name: 'Text 1', hex: '#000000' },
  { name: 'Background 2', hex: '#e7e6e6' },
  { name: 'Text 2', hex: '#44546a' },
  { name: 'Accent 1', hex: '#4472c4' },
  { name: 'Accent 2', hex: '#ed7d31' },
  { name: 'Accent 3', hex: '#a5a5a5' },
  { name: 'Accent 4', hex: '#ffc000' },
  { name: 'Accent 5', hex: '#5b9bd5' },
  { name: 'Accent 6', hex: '#70ad47' }
];
const STANDARD_COLORS = [
  { name: 'Dark Red', hex: '#c00000' },
  { name: 'Red', hex: '#ff0000' },
  { name: 'Orange', hex: '#ffc000' },
  { name: 'Yellow', hex: '#ffff00' },
  { name: 'Light Green', hex: '#92d050' },
  { name: 'Green', hex: '#00b050' },
  { name: 'Light Blue', hex: '#00b0f0' },
  { name: 'Blue', hex: '#0070c0' },
  { name: 'Dark Blue', hex: '#002060' },
  { name: 'Purple', hex: '#7030a0' }
];
let currentColorType = null; // 'fontcolor' | 'highlight'

const pickerId = (type) => type === 'fontcolor' ? 'fontcolor-picker' : 'highlighter-picker';

function openColorPicker(btn, type) {
  const picker = document.getElementById(pickerId(type));
  if (!picker) return;
  // toggle: clicking the same ribbon button again closes it
  const alreadyOpen = picker.classList.contains('show');
  closeDropdowns();
  if (alreadyOpen) { currentColorType = null; return; }
  currentColorType = type;
  populateColorGrid(type);
  openMenu(picker, btn); // position:fixed, placed from the button rect
}
function closeColorPickers() {
  ['fontcolor', 'highlight'].forEach(t => closeMenu(document.getElementById(pickerId(t))));
  currentColorType = null;
}
function populateColorGrid(type) {
  const t = document.getElementById(type === 'fontcolor' ? 'fontcolor-theme-grid' : 'highlighter-theme-grid');
  const s = document.getElementById(type === 'fontcolor' ? 'fontcolor-std-grid' : 'highlighter-std-grid');
  const render = list => list.map(c => `<div class="cp-swatch" style="background:${c.hex}" title="${c.name}" onclick="applyColorSwatch('${c.hex}','${type}')"></div>`).join('');
  if (t) t.innerHTML = render(THEME_COLORS);
  if (s) s.innerHTML = render(STANDARD_COLORS);
}
// keep the little A preview on the ribbon button in sync with the last applied colour
// (setRibbonSwatch lives in module 05; selection changes update it too)
function applyColorSwatch(color, type) {
  type === 'fontcolor' ? setFontColor(color) : setHighlight(color);
}
// 'Automatic' / 'No Color' pass 'inherit' / 'transparent' through the same path
// execCommand needs a live selection in the editor; clicking a ribbon control drops it.
// These bypass cmd(), so they restore the remembered selection themselves.
function focusEditorForCommand() {
  editor.focus();
  restoreEditorSelection();
}
// 'Automatic' / 'No Color' pass 'inherit' / 'transparent' through the same path
function setFontColor(color) {
  closeColorPickers();
  focusEditorForCommand();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, color === 'inherit' ? 'inherit' : color);
  document.execCommand('styleWithCSS', false, false);
  rememberEditorSelection();
  saveUndo(); updateStatus();
  setRibbonSwatch('fontcolor', color === 'inherit' ? '#c00000' : color);
  showToast('Font color applied', 'ok');
}
function setHighlight(color) {
  closeColorPickers();
  focusEditorForCommand();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('hiliteColor', false, (!color || color === 'transparent') ? 'transparent' : color);
  document.execCommand('styleWithCSS', false, false);
  rememberEditorSelection();
  saveUndo(); updateStatus();
  setRibbonSwatch('highlight', color === 'transparent' ? '#ffff00' : color);
  showToast('Highlight color applied', 'ok');
}
function pickCustomColor(type) {
  const input = document.getElementById(type === 'fontcolor' ? 'fontcolor-custom' : 'highlighter-custom');
  if (!input) return;
  input.onchange = () => applyColorSwatch(input.value, type);
  // the picker stays open: closing it first would drop the user gesture and blank the dialog
  input.click();
}
function showGradientMessage() {
  closeColorPickers();
  showModal('Gradient', '<p style="color:var(--text-2);font-size:11px">Gradient text color is not available in this edition.</p><div style="text-align:right;margin-top:10px"><button class="btn" onclick="closeModal()">OK</button></div>');
}
// close pickers on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeColorPickers();
});
// close pickers when clicking outside (the picker itself lives in #menu-layer while open)
document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('.dropdown') && !e.target.closest('.dropdown-menu') && !e.target.closest('.color-picker')) closeColorPickers();
});

// ═══════ INIT ═══════
loadDict();
loadAC();
// fill the palettes up front so the pickers are never blank when they open
populateColorGrid('fontcolor');
populateColorGrid('highlight');
// wire AutoFormat-As-You-Type triggers on keydown (Enter for lists/borders/tables/headings; space for math/smart-quotes tail)
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { if (handleAutoFormatKey(e)) { e.preventDefault(); } }
  if (e.key === ' ') { handleMathOnSpace(); }
  // terminal punctuation sentence case: if user types . ! ? then a letter, handled on next input word boundary loosely
});
// initial spell mark after load
setTimeout(markSpellingErrors, 800);
console.log('Module 09 (spell/autocorrect/autofORMAT/actions) loaded OK');
