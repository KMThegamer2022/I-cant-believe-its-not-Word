// Words whose spelling changes before -s / -ed / -ing (y -> i, doubling, e-drop).
function dictInflections(w) {
  const out = new Set();
  if (/[^aeiou]y$/.test(w)) out.add(w.slice(0, -1) + 'ies');
  else if (/(s|x|z|ch|sh)$/.test(w)) out.add(w + 'es');
  else out.add(w + 's');
  if (/e$/.test(w)) { out.add(w + 'd'); out.add(w.slice(0, -1) + 'ing'); }
  else if (/[^aeiou][aeiou][^aeiouwxy]$/.test(w)) { out.add(w + 'ed'); out.add(w + 'ing'); }
  else { out.add(w + 'ed'); out.add(w + 'ing'); }
  return out;
}

// Build the live dictionary once: base words + regular inflections + irregular forms.
const COMMON_WORDS = (() => {
  const dict = new Set(DICT_BASE);
  for (const w of DICT_BUSINESS) dict.add(w);
  for (const w of [...dict]) for (const f of dictInflections(w)) dict.add(f);
  for (const w of DICT_IRREGULAR) {
    if (dict.has(w)) continue;
    dict.add(w);
    for (const f of dictInflections(w)) dict.add(f);
  }
  return dict;
})();
console.log('Dictionary loaded: ' + COMMON_WORDS.size + ' words');
