(function () {

      resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-pref', pref);
    document.documentElement.setAttribute('data-pagemode', localStorage.getItem('icbimw-pagemode') || 'dark');

<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ═══════════ DARK THEME (default) ═══════════ */
:root,html[data-theme="dark"]{
  --titlebar-bg:#131313;
  --tabs-bg:#1b1b1b;
  --ribbon-bg:#232323;
  --ribbon-border:#3a3a3a;
  --canvas-bg:#121212;
  --panel-bg:#2b2b2b;
  --panel-bg2:#333333;
  --hover:#383838;
  --active-sel:#464646;
  --text:#f2f2f2;
  --text-2:#9a9a9a;
  --border:#3d3d3d;
  --input-bg:#1d1d1d;
  --input-border:#4a4a4a;
  --blue:#4472c4;
  --blue-dark:#203864;
  --blue-light:#5a8ede;
  --blue-hover:rgba(68,114,196,.25);
  --status-blue:#1b1b1b;
  --page-bg:#121212;
  --page:#2d2d2d;
  --page-text:#e9e9e9;
  --page-border:#3a3a3a;
  --shadow:0 8px 32px rgba(0,0,0,.6);
  --scroll-thumb:#4a4a4a;
  --accent-btn:#3d6fd1;
  --accent-btn-hover:#4e81e3;
  --danger:#e05252;
  --ok:#5cb85c;
  --warn:#e0a020;
  --heading-color:#7baaf7;
  /* ── Motion tokens (shared by both themes; see MOTION section below) ── */
  --dur-1:90ms; --dur-2:150ms; --dur-3:210ms; --dur-4:300ms;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.55,0,.45,1);
  --ease-inout:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --lift:2px;
}
/* ═══════════ LIGHT THEME ═══════════ */
html[data-theme="light"]{
  --titlebar-bg:#2b579a;
  --tabs-bg:#2b579a;
  --ribbon-bg:#f3f2f1;
  --ribbon-border:#d1d1d1;
  --canvas-bg:#e6e6e6;
  --panel-bg:#ffffff;
  --panel-bg2:#f5f5f5;
  --hover:#e8e8e8;
  --active-sel:#d0d7e2;
  --text:#333333;
  --text-2:#777777;
  --border:#d1d1d1;
  --input-bg:#ffffff;
  --input-border:#cccccc;
  --blue:#2b579a;
  --blue-dark:#1e3f6f;
  --blue-light:#3b7dd8;
  --blue-hover:#e8f0fe;
  --status-blue:#2b579a;
  --page-bg:#e6e6e6;
  --page:#ffffff;
  --page-text:#111111;
  --page-border:#d1d1d1;
  --shadow:0 8px 32px rgba(0,0,0,.3);
  --scroll-thumb:#bbbbbb;
  --accent-btn:#2b579a;
  --accent-btn-hover:#1e3f6f;
  --danger:#c0392b;
  --ok:#2e7d32;
  --warn:#b8860b;
  --heading-color:#2b579a;
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);background:var(--canvas-bg)}
body{display:flex;flex-direction:column}
button{font-family:inherit;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text)}
select,input{font-family:inherit;font-size:13px;color:var(--text);background:var(--input-bg)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#6a6a6a;background-clip:content-box;border:3px solid transparent}
/* ── Title Bar ── */
#titlebar{height:42px;background:var(--titlebar-bg);display:flex;align-items:center;color:var(--text);user-select:none;padding:0 8px;gap:6px;border-bottom:1px solid var(--ribbon-border)}
#titlebar .ticon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;font-size:15px}
#titlebar .ticon:hover{background:var(--hover)}
#qat{display:flex;align-items:center;gap:2px}
#qat button{width:30px;height:30px;border-radius:4px;color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center}
#qat button:hover{background:var(--hover)}
#autosave-wrap{display:flex;align-items:center;gap:6px;margin-left:8px;font-size:12px;color:var(--text)}
#autosave-toggle{width:36px;height:18px;border-radius:9px;background:#555;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
#autosave-toggle.on{background:var(--ok)}
#autosave-toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
#autosave-toggle.on::after{left:20px}
#autosave-state{font-size:11px;color:var(--text-2);min-width:64px}
#doc-title{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;margin:0 auto}
#doc-title input{background:transparent;border:1px solid transparent;color:var(--text);text-align:center;width:300px;padding:3px 6px;border-radius:3px;font-size:13px}
#doc-title input:hover,#doc-title input:focus{border-color:var(--input-border);outline:none}
#search-bar{display:flex;align-items:center;background:var(--panel-bg2);border:1px solid var(--border);border-radius:4px;padding:0 8px;height:26px;width:220px;gap:4px;font-size:12px;color:var(--text-2)}
#search-bar input{background:transparent;border:none;color:var(--text);width:100%;font-size:12px}
#search-bar input::placeholder{color:var(--text-2)}
#search-bar input:focus{outline:none}
#profile-area{display:flex;align-items:center;gap:6px;margin-left:auto}
#avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7c4dff,#4472c4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;color:#fff}
#share-btn{background:var(--accent-btn);color:#fff;border:none;border-radius:14px;padding:5px 14px;font-weight:600;font-size:12px;cursor:pointer;margin-left:6px}
#share-btn:hover{background:var(--accent-btn-hover)}
/* ── Ribbon Tabs ── */
#ribbon-tabs{display:flex;align-items:stretch;background:var(--tabs-bg);padding:0 8px;height:34px;gap:1px;overflow-x:auto;overflow-y:hidden;flex-shrink:0;border-bottom:1px solid var(--ribbon-border)}
#ribbon-tabs::-webkit-scrollbar{height:0}
#ribbon-tabs .tab{padding:6px 12px;color:var(--text-2);border-radius:4px 4px 0 0;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.1s;position:relative;display:flex;align-items:center}
#ribbon-tabs .tab:hover{color:var(--text);background:var(--hover)}
#ribbon-tabs .tab.active{background:var(--ribbon-bg);color:var(--text);font-weight:600}
#ribbon-tabs .tab.active::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--blue-light);border-radius:2px 2px 0 0}
#ribbon-tabs .file-tab{color:var(--text);font-weight:600}
#ribbon-tabs .file-tab:hover{background:var(--blue);color:#fff}
#ribbon-tabs .tab.ctx-tab{color:#e8c46a;background:rgba(232,196,106,.08)}
#ribbon-tabs .tab.ctx-tab.active{background:var(--ribbon-bg);color:#f0d78c}
#ribbon-tabs .tab.ctx-tab.active::after{background:#e8c46a}
/* ── Ribbon Content ── */
#ribbon{background:var(--ribbon-bg);border-bottom:1px solid var(--ribbon-border);padding:4px 8px 2px;display:block;overflow-x:auto;min-height:92px;flex-shrink:0}
#ribbon::-webkit-scrollbar{height:6px}
#ribbon::-webkit-scrollbar-thumb{border-width:1px}
.ribbon-panel{display:none;width:100%}
.ribbon-panel.active{display:flex;align-items:flex-start;gap:0;flex-wrap:nowrap;padding-bottom:2px;min-width:max-content}
.rgroup{display:flex;flex-direction:column;align-items:center;padding:0 6px;border-right:1px solid var(--ribbon-border);min-width:max-content}
.rgroup:last-child{border-right:none}
.rgroup-label{font-size:10px;color:var(--text-2);margin-top:2px;text-align:center;white-space:nowrap}
.rgroup-btns{display:flex;align-items:center;gap:1px;flex-wrap:wrap;justify-content:center}
.rbtn{display:flex;flex-direction:column;align-items:center;padding:3px 4px;border-radius:4px;font-size:11px;min-width:36px;min-height:36px;justify-content:center;gap:1px;color:var(--text)}
.rbtn:hover{background:var(--hover)}
.rbtn.active{background:var(--blue-hover);box-shadow:inset 0 0 0 1px var(--blue)}
.rbtn .icon{font-size:18px;line-height:1}
.rbtn .lbl{font-size:10px;white-space:nowrap}
.rbtn.large{min-width:56px;min-height:64px;padding:4px 6px}
.rbtn.large .icon{font-size:22px}
.rbtn.small{flex-direction:row;min-width:0;min-height:24px;padding:2px 6px;gap:4px}
.rbtn.small .icon{font-size:14px}
.rbtn.small .lbl{font-size:12px}
.rsep{width:1px;background:var(--ribbon-border);margin:4px 2px;align-self:stretch}
.rselect{border:1px solid var(--input-border);border-radius:4px;padding:2px 4px;background:var(--input-bg);font-size:12px;height:24px;color:var(--text)}
.rinput{border:1px solid var(--input-border);border-radius:4px;padding:2px 4px;width:48px;text-align:center;font-size:12px;height:24px;background:var(--input-bg);color:var(--text)}
.dropdown{position:relative}
.dropdown-menu{display:none;position:absolute;top:100%;left:0;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);z-index:7000;min-width:180px;padding:4px 0;max-height:320px;overflow-y:auto}
/* Open menus become position:fixed so they escape #ribbon's overflow clip (JS sets top/left from the trigger). */
.dropdown-menu.show{display:block;position:fixed;top:0;left:0;max-height:calc(100vh - 16px)}
.dropdown-menu button{display:block;width:100%;text-align:left;padding:6px 14px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--text)}
.dropdown-menu button:hover{background:var(--hover)}
.dropdown-menu hr{border:none;border-top:1px solid var(--border);margin:4px 8px}
/* color picker grid */
.color-grid{display:grid;grid-template-columns:repeat(10,18px);gap:2px;padding:6px}
.color-grid .swatch{width:18px;height:18px;border:1px solid var(--input-border);border-radius:2px;cursor:pointer}
.color-grid .swatch:hover{transform:scale(1.25);z-index:2;position:relative}
/* ── Page Break ── */
.page-break{border-top:2px dashed var(--page-border);margin:8px 0;position:relative;height:0;page-break-after:always;break-after:page}
.page-break::after{content:'Page Break';position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--page);padding:0 8px;font-size:9px;color:var(--text-2);border-radius:8px}
#editor-page{min-height:1056px}
/* ── Page modes (document canvas) ── */
html[data-pagemode="dark"] #editor-page{background:var(--page);color:var(--page-text);box-shadow:0 2px 14px rgba(0,0,0,.55)}
html[data-pagemode="dark"] #editor-page .page-break::after{background:var(--page)}
html[data-pagemode="light"] #editor-page{background:#ffffff;color:#111111;box-shadow:0 2px 14px rgba(0,0,0,.35)}
html[data-pagemode="light"] #editor-page .page-break::after{background:#fff}
/* ── Document views ── */
#editor-page.view-read{width:860px!important;column-count:2;column-gap:48px;padding:48px;font-size:14pt;line-height:1.7}
#editor-page.view-web{width:100%!important;min-height:auto!important;padding:24px 48px}
#editor-page.view-outline{font-family:'Courier New',monospace!important;font-size:12pt}
#editor-page.view-outline p,#editor-page.view-outline h1,#editor-page.view-outline h2,#editor-page.view-outline h3{margin:2px 0!important;border:none!important;padding:0!important}
#editor-page.view-draft{width:100%!important;min-height:auto!important;padding:8px 48px}
/* ── Default document typography ── */
#editor-page p,#editor-page li{color:inherit}
/* paragraphs created with Enter were flush against each other with no breathing room */
#editor-page p{margin:0 0 .55em}
#editor-page h1,#editor-page h2,#editor-page h3{color:var(--heading-color)}
/* ── Empty-document placeholder ── */
/* Drawn by CSS rather than being real <p> content, so it never reaches a saved file,
   the .docx, the word count or the spell checker. Fades out while the editor has focus,
   so it disappears the moment you click into the page. Offsets match #editor-page padding. */
#editor-page.is-empty::before{
  content:"Start typing your document here…";
  position:absolute;top:72px;left:72px;
  color:var(--text-2);pointer-events:none;user-select:none;
  transition:opacity var(--dur-2) var(--ease-out);
}
#editor-page.is-empty.is-focused::before,
#editor-page.is-empty:focus::before{opacity:0}

/* ── Panels / panes / dialogs share dark surfaces ── */
.pane{background:var(--panel-bg);color:var(--text);border-color:var(--border)}
/* ── Context menu ── */
#context-menu{display:none;position:fixed;z-index:9000;min-width:230px;background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:5px 0;font-size:12.5px;user-select:none;max-height:75vh;overflow-y:auto}
#context-menu .cm-item{display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer;color:var(--text);white-space:nowrap}
#context-menu .cm-item:hover{background:var(--hover)}
#context-menu .cm-item.disabled{opacity:.4;pointer-events:none}
#context-menu .cm-item .cm-ico{width:16px;text-align:center;flex-shrink:0}
#context-menu .cm-item .cm-key{margin-left:auto;color:var(--text-2);font-size:11px}
#context-menu .cm-sep{border-top:1px solid var(--border);margin:4px 0}
#context-menu .cm-head{padding:6px 16px 3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#e8c46a;font-weight:700}
/* ── Mini toolbar ── */
#mini-toolbar{display:none;position:fixed;z-index:8500;background:var(--panel-bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;gap:2px;align-items:center}
#mini-toolbar .mt-btn{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text)}
#mini-toolbar .mt-btn:hover{background:var(--hover)}
#mini-toolbar select{height:26px;font-size:12px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text);max-width:110px}
#mini-toolbar .mt-sep{width:1px;height:20px;background:var(--border);margin:0 3px}
/* ── Toasts ── */
#toast-container{position:fixed;right:18px;bottom:44px;z-index:9500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel-bg);border:1px solid var(--border);border-left:4px solid var(--blue);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:12.5px;min-width:240px;max-width:360px;pointer-events:auto}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast b{display:block;margin-bottom:2px}
/* ── Settings dialog ── */
#settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:6000;justify-content:center;align-items:center}
#settings-box{background:var(--panel-bg);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);width:720px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
#settings-box .st-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
#settings-box .st-body{display:flex;flex:1;overflow:hidden}
#settings-nav{width:170px;border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;background:var(--panel-bg2)}
#settings-nav .sn-item{padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:3px solid transparent;color:var(--text)}
#settings-nav .sn-item:hover{background:var(--hover)}
#settings-nav .sn-item.active{background:var(--blue-hover);border-left-color:var(--blue);font-weight:600}
#settings-panel{flex:1;padding:20px 24px;overflow-y:auto}
#settings-panel h3{font-size:14px;margin-bottom:14px}
#settings-panel .st-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
#settings-panel .st-row:last-child{border-bottom:none}
#settings-panel .st-row .st-desc{color:var(--text-2);font-size:11.5px;margin-top:2px}
#settings-panel select,#settings-panel input[type=text]{background:var(--input-bg);border:1px solid var(--input-border);border-radius:4px;color:var(--text);padding:5px 8px;min-width:170px}
#settings-panel input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px}
.st-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.btn{padding:7px 20px;border-radius:5px;border:1px solid var(--input-border);background:var(--panel-bg2);color:var(--text);cursor:pointer;font-size:12.5px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff}
.btn.primary:hover{background:var(--accent-btn-hover)}
/* ── Accessibility pane ── */
#access-pane{display:none;flex-direction:column;width:300px;background:var(--panel-bg);border-left:1px solid var(--border);flex-shrink:0;overflow:hidden;color:var(--text)}
#access-pane .ap-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:12.5px}
#access-pane .ap-body{flex:1;overflow-y:auto;padding:10px 12px}
.ap-score{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ap-score .ap-num{font-size:26px;font-weight:800}
.ap-issue{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--panel-bg2)}
.ap-issue .ap-t{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.ap-issue .ap-d{font-size:11.5px;color:var(--text-2);margin:3px 0 6px}
.ap-issue .ap-fix{font-size:11.5px;padding:4px 10px;border-radius:4px;background:var(--accent-btn);color:#fff;cursor:pointer}
.ap-issue .ap-fix:hover{background:var(--accent-btn-hover)}
.ap-issue.ok-issue{border-color:rgba(92,184,92,.5)}
.ap-ok{color:var(--ok);font-size:12.5px}
/* ── Misc controls ── */
label{cursor:pointer}
input[type=range]{accent-color:var(--blue)}
::placeholder{color:var(--text-2)}
/* ════════════════════════════════════════════════════════════════════════════
   MOTION
   One place for every animation in the app. All of it is switched off by
   html[data-motion="off"], which the Settings toggle and prefers-reduced-motion
   both set, so nothing below is mandatory for the UI to be usable.
   ════════════════════════════════════════════════════════════════════════════ */
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes ribbon-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes menu-in{from{opacity:0;transform:translateY(-7px) scale(.965)}to{opacity:1;transform:none}}
@keyframes menu-in-down{from{opacity:0;transform:translateY(7px) scale(.965)}to{opacity:1;transform:none}}
@keyframes pop-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slide-in-right{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slide-in-left{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes slide-down{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes scale-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translateX(44px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateX(44px) scale(.96)}}
@keyframes underline-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse-once{0%{box-shadow:0 0 0 0 var(--blue-hover)}100%{box-shadow:0 0 0 9px transparent}}
@keyframes sheet-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── Buttons: lift on hover, sink on press ── */
.rbtn,.btn,.ticon,#qat button,.ac-tab,.sn-item,.cm-item,.spell-item,.actions-item,
.ac-chip,.ereplace button,.ap-issue .ap-fix,#mini-toolbar .mt-btn{
  transition:background-color var(--dur-1) var(--ease-out),
             color var(--dur-1) var(--ease-out),
             border-color var(--dur-1) var(--ease-out),
             box-shadow var(--dur-2) var(--ease-out),
             transform var(--dur-1) var(--ease-out);
}
.rbtn:hover,.btn:hover,.ticon:hover,#qat button:hover,.ac-tab:hover,.sn-item:hover,
.cm-item:hover,.spell-item:hover,.actions-item:hover,#mini-toolbar .mt-btn:hover{
  transform:translateY(calc(-1 * var(--lift)));
}
.rbtn:active,.btn:active,.ticon:active,#qat button:active,.ac-chip:active,
.ereplace button:active,.ap-issue .ap-fix:active{transform:translateY(0) scale(.97)}
.rbtn.large:hover{transform:translateY(calc(-1 * var(--lift)))}

/* Keyboard users get a clear ring; mouse users don't see it. */
.rbtn:focus-visible,.btn:focus-visible,.ticon:focus-visible,#qat button:focus-visible,
.ac-tab:focus-visible,.sn-item:focus-visible,.cm-item:focus-visible,.tab:focus-visible,
.rselect:focus-visible,.rinput:focus-visible,#doc-title input:focus-visible,
#find-replace-bar button:focus-visible,#statusbar button:focus-visible{
  outline:2px solid var(--blue-light);outline-offset:1px;
}

/* ── Ribbon tab switching ── */
#ribbon-tabs .tab{transition:color var(--dur-2) var(--ease-out),background-color var(--dur-2) var(--ease-out)}
#ribbon-tabs .tab.active::after{animation:underline-in var(--dur-3) var(--ease-out);transform-origin:center}
/* cascade the groups so the ribbon "wipes" in left-to-right. Safe to animate transform
   here because open menus are re-parented into #menu-layer, out of this subtree. */
.ribbon-panel.active > *{animation:ribbon-in var(--dur-3) var(--ease-out) both}
.ribbon-panel.active > *:nth-child(1){animation-delay:0ms}
.ribbon-panel.active > *:nth-child(2){animation-delay:22ms}
.ribbon-panel.active > *:nth-child(3){animation-delay:44ms}
.ribbon-panel.active > *:nth-child(4){animation-delay:66ms}
.ribbon-panel.active > *:nth-child(5){animation-delay:88ms}
.ribbon-panel.active > *:nth-child(6){animation-delay:110ms}
.ribbon-panel.active > *:nth-child(7){animation-delay:132ms}
.ribbon-panel.active > *:nth-child(8){animation-delay:154ms}
.ribbon-panel.active > *:nth-child(n+9){animation-delay:176ms}

/* ── Dropdown menus, context menu, mini toolbar ── */
/* Menus are moved into #menu-layer on <body> while open, so only transform is animated. */
#menu-layer>.dropdown-menu{pointer-events:auto}
.dropdown-menu.show,.dropdown-menu.color-picker.show{animation:menu-in var(--dur-2) var(--ease-out);transform-origin:top left}
#context-menu{animation:scale-in var(--dur-2) var(--ease-out);transform-origin:top left}
#mini-toolbar{animation:pop-in var(--dur-2) var(--ease-out)}
.dropdown-menu button,.cp-row,.cp-more,.cp-custom{transition:background-color var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.dropdown-menu button:hover,.cp-row:hover,.cp-more:hover,.cp-custom:hover{transform:translateX(2px)}
.cp-swatch,.color-grid .swatch{transition:transform var(--dur-2) var(--spring),box-shadow var(--dur-2) var(--ease-out)}

/* ── Overlays ── */
#modal-overlay,#settings-overlay{animation:fade-in var(--dur-2) var(--ease-out)}
#modal-box,#settings-box{animation:pop-in var(--dur-3) var(--ease-out)}
#backstage{animation:slide-in-left var(--dur-3) var(--ease-out)}
#backstage .bs-nav{transition:background-color var(--dur-2) var(--ease-out),padding-left var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
#backstage .bs-nav:hover{padding-left:26px}
#settings-nav .sn-item{transition:background-color var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.ac-tabpanel.active{animation:sheet-in var(--dur-3) var(--ease-out)}
.ac-tab{position:relative}
.ac-tab.active::after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--blue);border-radius:2px}

/* ── Floating bits ── */
#table-picker{animation:pop-in var(--dur-2) var(--ease-out)}
#find-replace-bar{animation:slide-down var(--dur-3) var(--ease-out)}
#access-pane,#nav-pane,#comments-pane,#editor-pane{animation:slide-in-right var(--dur-3) var(--ease-out)}
.toast{animation:toast-in var(--dur-3) var(--ease-out)}
.toast.leaving{animation:toast-out var(--dur-2) var(--ease-in) forwards}
.ecard{animation:sheet-in var(--dur-3) var(--ease-out)}
.ecard:nth-child(2){animation-delay:40ms}
.ecard:nth-child(3){animation-delay:80ms}
#autosave-toggle::after{box-shadow:0 0 0 0 rgba(92,184,92,.5)}
#autosave-toggle.on::after{animation:pulse-once var(--dur-4) var(--ease-out)}

/* ── Chrome ── */
::-webkit-scrollbar-thumb{transition:background var(--dur-2) var(--ease-out)}
::-webkit-scrollbar-thumb:hover{background:#6a6a6a;background-clip:content-box}
#doc-title input{transition:border-color var(--dur-2) var(--ease-out),background-color var(--dur-2) var(--ease-out)}
.rselect,.rinput,#settings-panel select,#settings-panel input[type=text],.modal select,.modal input{
  transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
}
.rselect:hover,.rinput:hover,#settings-panel select:hover{border-color:var(--blue)}
.ecard:hover,.ap-issue:hover{border-color:var(--blue)}
/* Theme swap cross-fades instead of snapping */
html,body,#ribbon,#ribbon-tabs,#titlebar,#statusbar,#editor-page,.pane,#backstage{
  transition:background-color var(--dur-3) var(--ease-out),color var(--dur-3) var(--ease-out),border-color var(--dur-3) var(--ease-out);
}

/* ── Reduced motion: system preference, or the in-app Settings toggle ── */
@media (prefers-reduced-motion:reduce){
  html:not([data-motion="on"]) *,
  html:not([data-motion="on"]) *::before,
  html:not([data-motion="on"]) *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
html[data-motion="off"] *,
html[data-motion="off"] *::before,
html[data-motion="off"] *::after{
  animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;scroll-behavior:auto!important;
}

/* ── Print: only the document ── */
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;animation:none!important;transition:none!important}
  *,*::before,*::after{animation:none!important;transition:none!important}
  #editor-page.is-empty::before{display:none!important}
  #titlebar,#ribbon-tabs,#ribbon,#statusbar,#backstage,#modal-overlay,#settings-overlay,#context-menu,#mini-toolbar,#toast-container,#find-replace-bar,#table-picker,#nav-pane,#comments-pane,#editor-pane,#access-pane,#draw-indicator,#ruler,#access-watermark{display:none!important}
  #main-area{display:block!important;overflow:visible!important}
  #page-container{overflow:visible!important;background:#fff!important;padding:0!important}
  #editor-page{width:auto!important;min-height:0!important;box-shadow:none!important;margin:0!important;padding:0.5in!important;background:#fff!important;color:#000!important;zoom:1!important;transform:none!important;border:none!important}
  #ink-canvas{display:none!important}
  .page-break{border-top:1px dashed #999!important}
  .page-break::after{display:none}
}

/* ═══════════════ SPELL CHECK MARKUP ═══════════════ */
/* Only the squiggle marks a misspelling -- the text keeps whatever colour it already
   had, so a typo no longer repaints the whole sentence. text-decoration is used rather
   than a positioned ::after so the wave follows the text across line breaks, scales with
   the zoom level, and adds no positioning context for animations and menus to fight.
   Browsers without wavy support fall back to a solid line in the same colour. */
.icw-spell{
  text-decoration-line: underline;
  text-decoration-style: wavy;
  text-decoration-color: #c00;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}
.icw-grammar{
  text-decoration-line: underline;
  text-decoration-style: wavy;
  text-decoration-color: #7b1fa2;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}
.icw-ignore{color:inherit}

/* ═══════════════ ENHANCED COLOR PALETTE PICKERS ═══════════════ */
/* NB: must stay display:none until .show — otherwise it overrides .dropdown-menu{display:none} and is always visible */
.dropdown-menu.color-picker{display:none;flex-direction:column;gap:6px;padding:8px;min-width:210px}
.dropdown-menu.color-picker.show{display:flex}
.color-picker .cp-row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--text)}
.color-picker .cp-row:hover{background:var(--hover)}
.color-picker .cp-row .cp-chip{width:22px;height:22px;border-radius:3px;border:1px solid var(--input-border);flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.color-picker .cp-row.auto .cp-chip{background-image:linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%,#999),linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%,#999);background-size:8px 8px;background-position:0 0,4px 4px;border-color:#999}
.color-picker .cp-row.none .cp-chip{background:#fff;border:2px solid #c00}
.color-picker .cp-label{font-size:11.5px;color:var(--text-2);white-space:nowrap;flex:1}
.color-picker .cp-sep{border-top:1px solid var(--border);margin:5px 0}
.color-picker .cp-head{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#e8c46a;font-weight:700;padding:2px 8px}
.color-picker .cp-more{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--text)}
.color-picker .cp-more:hover{background:var(--hover)}
.color-picker .cp-grid{display:grid;grid-template-columns:repeat(5,20px);gap:4px;padding:2px 6px}
.color-picker .cp-swatch{width:20px;height:20px;border:1px solid var(--input-border);border-radius:3px;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.color-picker .cp-swatch:hover{transform:scale(1.3);z-index:2;position:relative}
.color-picker .cp-swatch.active{box-shadow:0 0 0 2px var(--blue)}
.color-picker .cp-ico{width:16px;text-align:center;flex-shrink:0;color:var(--text-2)}

/* custom color input row */
.color-picker .cp-custom{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:4px;cursor:pointer}
.color-picker .cp-custom:hover{background:var(--hover)}
.color-picker input[type=color]{width:26px;height:22px;border:none;background:none;cursor:pointer;padding:0}

/* ═══════════════ EDITOR ISSUE CARDS ═══════════════ */
.ecard{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:7px;background:var(--panel-bg2)}
.ecard .etitle{font-size:11.5px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--text)}
.ecard .ecount{color:var(--text-2);font-weight:600}
.ecard .esub{font-size:11px;color:var(--text-2);margin:4px 0 6px}
.ecard .ereplace{display:flex;gap:6px;flex-wrap:wrap}
.ecard .ereplace button{font-size:11px;padding:3px 9px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text);cursor:pointer}
.ecard .ereplace button:hover{background:var(--hover)}
.ecard .ereplace button .earrow{color:var(--text-2);margin:0 1px}
.ecard .enone{padding:3px 9px;font-size:11px;border:1px dashed var(--input-border);border-radius:4px;color:var(--text-2);opacity:.8}
.ecard .ereplace .apply{background:var(--blue);color:#fff;border-color:var(--blue)}
.ecard .ereplace .apply:hover{background:var(--blue-light)}
.ecard .ecat{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:4px}

/* ═══════════════ AUTOCORRECT / AUTOFORMAT MODAL ═══════════════ */
.ac-modal{width:820px;max-width:94vw;max-height:92vh}
.ac-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:8px}
.ac-tab{padding:9px 16px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent}
.ac-tab:hover{background:var(--hover)}
.ac-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.ac-tabpanel{display:none;overflow-y:auto;max-height:64vh;padding-bottom:6px}
.ac-tabpanel.active{display:block}
.ac-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.ac-row:last-child{border-bottom:none}
.ac-row label{font-size:12px;color:var(--text);cursor:pointer;flex:1}
.ac-row .ac-desc{font-size:11px;color:var(--text-2)}
.ac-actions{display:flex;gap:6px}
.ac-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.ac-table th,.ac-table td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.ac-table th{background:var(--panel-bg2);font-weight:600;color:var(--text-2)}
.ac-table tr:hover{background:var(--hover)}
.ac-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:9px;border:1px solid var(--border);font-size:10.5px;color:var(--text-2)}
.ac-chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ac-chip .ac-del{margin-left:5px;cursor:pointer;color:var(--text-2);font-weight:700}
.ac-chip .ac-del:hover{color:var(--danger)}
.ac-inputs{display:flex;gap:8px;align-items:center}
.ac-inputs input{flex:1;min-width:140px}
.ac-hint{font-size:11px;color:var(--text-2);margin-top:4px}
.ac-btns{display:flex;gap:8px;margin-top:10px}
.spell-item{padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px}
.spell-item:last-child{border-bottom:none}
.spell-item:hover{background:var(--hover)}
.spell-word{font-weight:600;color:var(--text)}
.spell-def{font-size:11px;color:var(--text-2);margin-top:2px}
.actions-item{padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px}
.actions-item:last-child{border-bottom:none}
.actions-item:hover{background:var(--hover)}
.actions-item .ai-kind{font-size:10px;color:#e8c46a;font-weight:700;min-width:70px}
</style>
</head>

<!-- TITLE BAR -->
<div id="titlebar">
  <div class="ticon" id="btn-settings" title="Settings" onclick="openSettings()">&#9881;</div>
  <div id="qat">
    <button id="btn-save" title="Save (Ctrl+S)" onclick="saveDoc()">&#128190;</button>
    <button id="btn-undo" title="Undo (Ctrl+Z)" onclick="doUndo()">&#8630;</button>
    <button id="btn-redo" title="Redo (Ctrl+Y)" onclick="doRedo()">&#8631;</button>

  </div>
  <div id="autosave-wrap">

    <span id="autosave-state"></span>
  </div>

  <div id="doc-title"><input id="docname" value="Document1" spellcheck="false"></div>
  <div class="ticon" id="btn-themecycle" title="Switch theme" onclick="cycleTheme()">&#9680;</div>

    <div id="share-btn" title="Share" onclick="shareDoc()">&#9993; Share</div>
    <div id="avatar" title="Account">W</div>
  </div>
</div>
<!-- RIBBON TABS -->
<div id="ribbon-tabs">
  <div class="tab file-tab" data-panel="panel-file" onclick="switchTab(this)">File</div>
  <div class="tab active" data-panel="panel-home" onclick="switchTab(this)">Home</div>
  <div class="tab" data-panel="panel-insert" onclick="switchTab(this)">Insert</div>
  <div class="tab" data-panel="panel-draw" onclick="switchTab(this)">Draw</div>
  <div class="tab" data-panel="panel-design" onclick="switchTab(this)">Design</div>
  <div class="tab" data-panel="panel-layout" onclick="switchTab(this)">Layout</div>
  <div class="tab" data-panel="panel-references" onclick="switchTab(this)">References</div>
  <div class="tab" data-panel="panel-mailings" onclick="switchTab(this)">Mailings</div>
  <div class="tab" data-panel="panel-review" onclick="switchTab(this)">Review</div>
  <div class="tab" data-panel="panel-view" onclick="switchTab(this)">View</div>

  <div class="tab ctx-tab" id="tab-picture" data-panel="panel-picture" style="display:none" onclick="switchTab(this)">Picture Format</div>
</div>
<script>
// STANDALONE tab switching — runs immediately, independent of all other scripts
function switchTab(t) {
  var all = document.querySelectorAll('#ribbon-tabs .tab');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
  var panels = document.querySelectorAll('.ribbon-panel');
  for (var j = 0; j < panels.length; j++) { panels[j].classList.remove('active'); panels[j].style.display = 'none'; }
  t.classList.add('active');
  if (t.classList.contains('file-tab')) {
    document.getElementById('backstage').style.display = 'flex';
    try { showBackstagePanel('new'); } catch (e) {}
    return;
  }
  var p = document.getElementById(t.getAttribute('data-panel'));
  if (p) {
    p.classList.add('active');
    p.style.display = 'flex';
  }
}
// Backup: event delegation on the tab strip
document.getElementById('ribbon-tabs').addEventListener('click', function (e) {
  var t = e.target;
  while (t && t !== this && !(t.classList && t.classList.contains('tab'))) t = t.parentNode;
  if (t && t !== this && t.classList && t.classList.contains('tab')) switchTab(t);
});
console.log('Tab switching loaded OK');
</script>
<script>
// STANDALONE backstage functions — bulletproof, defined early
function closeBackstage() {
  document.getElementById('backstage').style.display = 'none';
}
function showBackstagePanel(panel) {
  var c = document.getElementById('backstage-content');
  if (!c) return;
  var navs = document.querySelectorAll('.bs-nav');
  for (var i = 0; i < navs.length; i++) {
    navs[i].style.background = '';
    navs[i].style.fontWeight = '';
    if (navs[i].textContent.trim().toLowerCase() === panel.toLowerCase()) {
      navs[i].style.background = 'rgba(255,255,255,.15)';
      navs[i].style.fontWeight = '700';
    }
  }
  var d = new Date().toLocaleString();
  var btnP = 'padding:10px 18px;border:1px solid var(--input-border);border-radius:5px;cursor:pointer;background:var(--panel-bg2);color:var(--text);margin:0 8px 8px 0;font-size:13px';
  var btnPrimary = 'padding:10px 22px;border:none;border-radius:5px;cursor:pointer;background:var(--accent-btn);color:#fff;margin:0 8px 8px 0;font-size:13px;font-weight:600';
  var content = {
    home: '<h2 style="margin-bottom:6px">I can\'t believe it\'s not Word</h2><p style="color:var(--text-2)">A word processor that runs in your browser.</p><div style="margin-top:18px"><button onclick="newDoc()" style="' + btnPrimary + '">&#128196; New blank document</button><button onclick="openLocalFile()" style="' + btnP + '">&#128193; Open a file</button><button onclick="openSettings()" style="' + btnP + '">&#9881; Settings</button></div>',
    new: '<h2>New</h2><div style="display:flex;gap:16px;margin-top:16px"><button onclick="newDoc()" style="' + btnP + '"><div style="width:90px;height:116px;background:var(--page);border:1px solid var(--border);margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>Blank document</button><button onclick="newDoc()" style="' + btnP + '"><div style="width:90px;height:116px;background:linear-gradient(135deg,#2b579a,#7bb3f0);margin-bottom:8px;border-radius:4px"></div>Resume</button><button onclick="newDoc()" style="' + btnP + '"><div style="width:90px;height:116px;background:linear-gradient(135deg,#2e7d32,#66bb6a);margin-bottom:8px;border-radius:4px"></div>Report</button></div>',
    open: '<h2>Open</h2><div style="margin-top:16px"><button onclick="openLocalFile()" style="' + btnPrimary + '">&#128193; Browse this device...</button><p style="color:var(--text-2);margin-top:10px;font-size:12px">Supported: .docx, .doc, .html, .htm, .rtf, .txt</p></div>',
    info: '<h2>Info</h2><div style="margin-top:16px"><p><b>Pages:</b> <span id="info-pages">1</span></p><p><b>Words:</b> <span id="info-words">0</span></p><p><b>Characters:</b> <span id="info-chars">0</span></p><p><b>Paragraphs:</b> <span id="info-paras">0</span></p><p><b>Last modified:</b> <span id="info-modified">' + d + '</span></p><p style="margin-top:14px"><button onclick="encryptDoc()" style="' + btnP + '">&#128274; Encrypt with Password</button><button onclick="inspectDoc()" style="' + btnP + '">&#128065; Inspect Document</button></p></div>',
    save: '',
    saveas: '<h2>Save As</h2><div style="margin-top:16px"><p>File name:</p><input id="saveas-name" style="width:320px;padding:7px;border:1px solid var(--input-border);border-radius:4px;margin:8px 0;background:var(--input-bg);color:var(--text)"><p>Save as type:</p><select id="saveas-type" style="width:320px;padding:7px;border:1px solid var(--input-border);border-radius:4px;margin:8px 0;background:var(--input-bg);color:var(--text)"><option value="docx">Word Document (.docx)</option><option value="html">Web Page (.html)</option><option value="rtf">Rich Text Format (.rtf)</option><option value="txt">Plain Text (.txt)</option></select><br><button onclick="doSaveAs()" style="' + btnPrimary + '">Save</button></div>',
    print: '<h2>Print</h2><div style="margin-top:16px"><button onclick="window.print()" style="' + btnPrimary + '">&#128424; Print / Save as PDF</button><p style="color:var(--text-2);margin-top:10px;font-size:12px">In the print dialog choose "Save as PDF" as the destination to export a PDF.</p></div>',
    share: '<h2>Share</h2><div style="margin-top:16px"><button onclick="shareDoc()" style="' + btnPrimary + '">&#9993; Share document</button><p style="color:var(--text-2);margin-top:10px;font-size:12px">Sends a .docx file (opens natively in Word and Outlook). Uses your system share sheet when available, otherwise downloads the .docx and opens your email app.</p></div>',
    export: '<h2>Export</h2><div style="margin-top:16px"><button onclick="exportPDF()" style="padding:10px 22px;background:#c0392b;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:0 8px 8px 0;font-size:13px;font-weight:600">&#128196; PDF (via Print)</button><button onclick="exportFile(\'docx\')" style="' + btnP + '">Word (.docx)</button><button onclick="exportFile(\'rtf\')" style="' + btnP + '">Rich Text (.rtf)</button><button onclick="exportFile(\'html\')" style="' + btnP + '">Web Page (.html)</button><button onclick="exportFile(\'txt\')" style="' + btnP + '">Plain Text (.txt)</button></div>',
    transform: '<h2>Transform</h2><p style="margin-top:16px">Turn your document into a web page.</p>',
    account: '<h2>Account</h2><div style="margin-top:16px;display:flex;gap:16px"><div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7c4dff,#4472c4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700">W</div><div><p><b>Word User</b></p><p style="color:var(--text-2)">user@example.com</p><p style="color:var(--text-2);font-size:11px">I can\'t believe it\'s not Word (Free Web Edition)</p></div></div>',
    options: '<h2>Options</h2><p style="margin-top:16px;color:var(--text-2)">Settings have moved to the Settings dialog.</p><button onclick="openSettings()" style="' + btnPrimary + '">&#9881; Open Settings</button>'
  };
  if (panel === 'save') { try { saveDoc(); } catch (e) {} return; }
  if (panel === 'options') { closeBackstage(); setTimeout(function(){ try { openSettings(); } catch (e) {} }, 10); return; }
  c.innerHTML = content[panel] || '<h2>' + panel + '</h2><p style="color:var(--text-2);margin-top:16px">Coming soon.</p>';
  c.scrollTop = 0;
  try { if (typeof updateStatus === 'function') updateStatus(); } catch (e) {}
}
console.log('Backstage functions loaded OK');
</script>
