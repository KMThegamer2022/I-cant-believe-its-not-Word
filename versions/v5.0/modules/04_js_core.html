<script>
// ═══════════════ CORE EDITOR ═══════════════
const editor = document.getElementById('editor-page');
let undoStack = [], redoStack = [], savedRange = null;

function cmd(c, v) {
  document.execCommand(c, false, v || null);
  editor.focus();
  updateStatus();
  saveUndo();
}
function saveUndo() {
  const h = editor.innerHTML;
  if (undoStack[undoStack.length-1] !== h) {
    undoStack.push(h);
    if (undoStack.length > 200) undoStack.shift();
    redoStack = [];
  }
}
function doUndo() {
  if (undoStack.length > 1) {
    redoStack.push(undoStack.pop());
    editor.innerHTML = undoStack[undoStack.length-1];
    updateStatus();
  }
}
function doRedo() {
  if (redoStack.length) {
    const h = redoStack.pop();
    undoStack.push(h);
    editor.innerHTML = h;
    updateStatus();
  }
}

// Font
function applyFontFamily(f) { cmd('fontName', f); }
function applyFontSize(s) {
  // execCommand fontSize only takes 1-7, so wrap in span
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const span = document.createElement('span');
  span.style.fontSize = s + 'pt';
  try { span.appendChild(sel.extractContents()); sel.insertNode(span); } catch(e) {}
  saveUndo();
}
function growFont() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const el = sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
  const cur = parseFloat(getComputedStyle(el).fontSize);
  el.style.fontSize = (cur + 2) + 'px';
  saveUndo();
}
function shrinkFont() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const el = sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
  const cur = parseFloat(getComputedStyle(el).fontSize);
  el.style.fontSize = Math.max(6, cur - 2) + 'px';
  saveUndo();
}
function changeCase(type) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  let text = sel.toString();
  switch(type) {
    case 'sentence': text = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase(); break;
    case 'lower': text = text.toLowerCase(); break;
    case 'upper': text = text.toUpperCase(); break;
    case 'capitalize': text = text.replace(/\w\S*/g, w=>w[0].toUpperCase()+w.slice(1).toLowerCase()); break;
    case 'toggle': text = text.split('').map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join(''); break;
  }
  sel.deleteContents();
  sel.insertNode(document.createTextNode(text));
  saveUndo();
}

// Format Painter
let fpActive = false, fpStyles = {};
function formatPainter() {
  const sel = window.getSelection();
  if (!fpActive && sel.rangeCount) {
    const el = sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;
    const cs = getComputedStyle(el);
    fpStyles = {
      fontFamily: cs.fontFamily, fontSize: cs.fontSize, fontWeight: cs.fontWeight,
      fontStyle: cs.fontStyle, textDecoration: cs.textDecoration,
      color: cs.color, backgroundColor: cs.backgroundColor,
      textAlign: cs.textAlign
    };
    fpActive = true;
    document.getElementById('btn-bold').classList.add('active');
    editor.style.cursor = 'copy';
  } else {
    applyFpStyles();
    fpActive = false;
    editor.style.cursor = '';
    document.getElementById('btn-bold').classList.remove('active');
  }
}
function applyFpStyles() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const span = document.createElement('span');
  Object.assign(span.style, fpStyles);
  try { span.appendChild(sel.extractContents()); sel.insertNode(span); } catch(e) {}
  saveUndo();
}

// Paragraph
function togglePilcrow() {
  editor.classList.toggle('show-pilcrow');
  if (editor.classList.contains('show-pilcrow')) {
    editor.querySelectorAll('p,div,li').forEach(el=>{
      if(!el.querySelector('::after')) el.setAttribute('data-pilcrow','¶ ');
    });
    editor.style.position='relative';
    // Use CSS pseudo-element approach
    if (!document.getElementById('pilcrow-style')) {
      const s=document.createElement('style');s.id='pilcrow-style';
      s.textContent='#editor-page p::after,#editor-page div::after{content:"¶";color:#aaa;margin-left:2px}';
      document.head.appendChild(s);
    }
  } else {
    const s=document.getElementById('pilcrow-style'); if(s)s.remove();
  }
}
function setLineSpacing(v) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  let node = sel.anchorNode;
  while (node && node !== editor && node.tagName !== 'P' && node.tagName !== 'DIV' && node.tagName !== 'LI') node = node.parentElement;
  if (node && node !== editor) node.style.lineHeight = v;
  saveUndo();
}
function setParaSpacing(b, a) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  let node = sel.anchorNode;
  while (node && node !== editor && node.tagName !== 'P' && node.tagName !== 'DIV') node = node.parentElement;
  if (node && node !== editor) { node.style.marginTop = b+'px'; node.style.marginBottom = a+'px'; }
  saveUndo();
}
function multilevelList() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  let node = sel.anchorNode;
  while (node && node !== editor && node.tagName !== 'P') node = node.parentElement;
  if (node) {
    const lvl = (parseInt(node.dataset.lvl)||0)+1;
    node.dataset.lvl = lvl%4;
    node.style.marginLeft = (lvl%4 * 40) + 'px';
    if (!node.textContent.match(/^[-*•\d]/)) node.textContent = '• ' + node.textContent;
  }
  saveUndo();
}

// Styles
function applyStyle(s) {
  const sel = window.getSelection();
  let node = sel.anchorNode;
  while (node && node !== editor && !/^(P|DIV|H1|H2|H3|H4|H5|H6|LI|BLOCKQUOTE)$/.test(node.tagName || '')) node = node.parentElement;
  if (!node || node === editor) { editor.focus(); return; }
  let tag = 'p', css = '';
  switch (s) {
    case 'normal': tag = 'p'; css = 'font-size:12pt;font-weight:400;color:inherit;margin:0 0 8px 0'; break;
    case 'title': tag = 'h1'; css = 'font-size:26pt;font-weight:700;color:var(--heading-color);margin:0 0 4px 0;padding-bottom:4px;border-bottom:2px solid var(--blue)'; break;
    case 'subtitle': tag = 'p'; css = 'font-size:14pt;font-weight:400;color:#9a9a9a;margin:0 0 16px 0'; break;
    case 'h1': tag = 'h1'; css = 'font-size:18pt;font-weight:700;color:var(--heading-color);margin:16px 0 6px 0'; break;
    case 'h2': tag = 'h2'; css = 'font-size:15pt;font-weight:700;color:var(--heading-color);margin:12px 0 4px 0'; break;
    case 'h3': tag = 'h3'; css = 'font-size:13pt;font-weight:600;color:var(--heading-color);margin:8px 0 4px 0'; break;
  }
  const el = document.createElement(tag);
  el.style.cssText = css;
  el.innerHTML = node.innerHTML || '<br>';
  node.replaceWith(el);
  // place cursor in the new node
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges(); sel.addRange(range);
  saveUndo();
  try { updateNavPane(); } catch (e) {}
}

// Insert helpers
const PAGE_HEIGHT = 1056; // 11 inches at 96dpi
function insertPageBreak() {
  const sel = window.getSelection();
  if (!sel.rangeCount) { editor.focus(); return; }
  const pb = document.createElement('div');
  pb.className = 'page-break';
  pb.contentEditable = 'false';
  const range = sel.getRangeAt(0);
  range.collapse(false); // collapse to end of selection
  range.insertNode(pb);
  // Insert a new paragraph after the break and put cursor there
  const np = document.createElement('p');
  np.innerHTML = '<br>';
  pb.parentNode.insertBefore(np, pb.nextSibling);
  const nr = document.createRange();
  nr.setStart(np, 0);
  nr.collapse(true);
  sel.removeAllRanges();
  sel.addRange(nr);
  editor.focus();
  saveUndo();
  updateStatus();
}
function insertBlankPage() {
  const pb = document.createElement('div');
  pb.className = 'page-break';
  pb.contentEditable = 'false';
  editor.appendChild(pb);
  const np = document.createElement('p');
  np.innerHTML = '<br>';
  editor.appendChild(np);
  saveUndo();
  updateStatus();
}
// Auto page break: check if content overflows and insert break
function checkAutoPageBreak() {
  if (editor.scrollHeight > PAGE_HEIGHT * 1.5) {
    // Content is significantly taller than 1.5 pages — insert a visual break marker at the page boundary
    const existingBreaks = editor.querySelectorAll('.page-break');
    const expectedBreaks = Math.floor(editor.scrollHeight / PAGE_HEIGHT) - 1;
    if (existingBreaks.length < expectedBreaks) {
      // Find the element closest to the page boundary
      const children = Array.from(editor.childNodes);
      let cumHeight = 0;
      for (const child of children) {
        if (child.nodeType !== 1) continue; // skip text nodes
        if (child.classList && child.classList.contains('page-break')) { cumHeight = 0; continue; }
        cumHeight += child.offsetHeight || 0;
        if (cumHeight >= PAGE_HEIGHT && existingBreaks.length < expectedBreaks) {
          const pb = document.createElement('div');
          pb.className = 'page-break';
          pb.contentEditable = 'false';
          editor.insertBefore(pb, child);
          break; // one at a time to avoid cursor issues
        }
      }
    }
  }
}
function insertHorizontalRule() { cmd('insertHorizontalRule'); }
function insertDateTime() {
  const d = new Date();
  cmd('insertText', d.toLocaleString());
}
function insertPicture() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => cmd('insertHTML', `<img src="${r.result}" style="max-width:100%;margin:8px 0" draggable="true">`);
    r.readAsDataURL(f);
  };
  inp.click();
}
function insertLink() {
  const url = prompt('Enter URL:', 'https://');
  if (!url) return;
  const sel = window.getSelection();
  if (sel.isCollapsed) cmd('insertHTML', `<a href="${url}" target="_blank">${url}</a>`);
  else cmd('createLink', url);
}
function insertBookmark() {
  const name = prompt('Bookmark name:');
  if (!name) return;
  cmd('insertHTML', `<span id="bm-${name}" style="background:#fffbe6;border-bottom:1px dashed #c00">&nbsp;</span>`);
}
function insertCrossRef() {
  const bms = Array.from(editor.querySelectorAll('[id^="bm-"]'));
  if (!bms.length) { alert('No bookmarks found. Insert a bookmark first.'); return; }
  const list = bms.map(b=>b.id.replace('bm-','')).join(', ');
  const name = prompt('Enter bookmark name to reference:\nAvailable: ' + list);
  if (name) cmd('insertText', `(see bookmark: ${name})`);
}
function insertSymbolMenu(btn) {
  const syms = '±×÷≠≤≥≈∞∑∏√∫∂αβγδεζηθικλμνξπρστυφχψωΩ←↑→↓↔⇒⇔♠♣♥♦♪♫✓✗☐☑★☆☀☁☂§¶†‡•…‰′″‴'.split('');

}
function insertWordArt() {

}
function insertDropCap() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const el = sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement;

}
function insertTextBox() {
  cmd('insertHTML', `<div style="border:2px solid #2b579a;padding:12px;margin:8px 0;min-height:60px;position:relative;background:#fff" contenteditable="true"><span style="color:#999">Type in text box...</span></div>`);
}
function insertHeader() {
  let h = document.getElementById('doc-header');
  if (!h) { h = document.createElement('div'); h.id = 'doc-header'; h.contentEditable = 'true'; h.style.cssText = 'text-align:center;color:#888;border-bottom:1px solid #ccc;margin-bottom:16px;padding:4px;min-height:24px'; h.innerHTML = 'Header — click to edit'; editor.prepend(h); }

}
function insertFooter() {
  let f = document.getElementById('doc-footer');
  if (!f) { f = document.createElement('div'); f.id = 'doc-footer'; f.contentEditable = 'true'; f.style.cssText = 'text-align:center;color:#888;border-top:1px solid #ccc;margin-top:16px;padding:4px;min-height:24px'; f.innerHTML = 'Footer — click to edit'; editor.appendChild(f); }

}
function insertPageNumber() {
  const pos = prompt('Page number position:', 'bottom');

function insertCoverPage() {
  cmd('insertHTML', `<div style="text-align:center;padding:120px 40px;border:3px double #2b579a;margin-bottom:24px" contenteditable="true">

    <p style="margin-top:60px;color:#999">Author Name<br>${new Date().toLocaleDateString()}</p>
  </div>`);

}
function insertOnlineVideo() {

}

// Tables
function showInsertTable() {
  const grid = document.getElementById('table-grid');
  const picker = document.getElementById('table-picker');
  grid.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 10; c++) {
      const cell = document.createElement('div');
      cell.style.cssText = 'width:24px;height:24px;border:1px solid var(--input-border);cursor:pointer;transition:.1s';
      cell.dataset.r = r+1; cell.dataset.c = c+1;
      cell.onmouseenter = () => {
        grid.querySelectorAll('div').forEach(d => {
          d.style.background = (+d.dataset.r <= r+1 && +d.dataset.c <= c+1) ? 'var(--blue)' : 'transparent';
        });
        document.getElementById('table-grid-label').textContent = `${c+1} × ${r+1} Table`;
      };
      cell.onclick = () => { insertTable(r+1, c+1); picker.style.display = 'none'; };
      grid.appendChild(cell);
    }
  }
  const btn = document.querySelector('[onclick="showInsertTable()"]');
  const rect = btn.getBoundingClientRect();
  picker.style.left = rect.left + 'px';
  picker.style.top = (rect.bottom + 4) + 'px';
  picker.style.display = 'block';
}
function insertTable(rows, cols) {
  let html = '<table style="border-collapse:collapse;width:100%;margin:8px 0">';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) html += '<td style="border:1px solid #999;padding:6px;min-width:40px;min-height:24px"><br></td>';
    html += '</tr>';
  }
  html += '</table><p><br></p>';
  cmd('insertHTML', html);
}

function doChart(type) {
  const canv = document.createElement('canvas');
  canv.width = 400; canv.height = 250;
  canv.style.cssText = 'border:1px solid #ddd;border-radius:4px;margin:8px 0;max-width:100%';
  const ctx = canv.getContext('2d');
  const colors = ['#2b579a','#4a90d9','#7bb3f0','#a8d4f7','#cce4f7'];
  const labels = ['Q1','Q2','Q3','Q4'];
  const data = [65,45,80,55];
  ctx.fillStyle = '#f8f8f8'; ctx.fillRect(0,0,400,250);
  ctx.fillStyle = '#333'; ctx.font = 'bold 14px Segoe UI'; ctx.fillText('Chart Title', 140, 20);
  if (type === 'bar') {
    data.forEach((v,i) => { ctx.fillStyle = colors[i]; ctx.fillRect(50+i*80, 220-v*2, 50, v*2); ctx.fillStyle='#333'; ctx.font='11px Segoe UI'; ctx.fillText(labels[i], 60+i*80, 240); });
  } else if (type === 'line') {
    ctx.strokeStyle = '#2b579a'; ctx.lineWidth = 2; ctx.beginPath();
    data.forEach((v,i) => { const x=50+i*80,y=220-v*2; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    data.forEach((v,i) => { ctx.fillStyle='#2b579a'; ctx.beginPath(); ctx.arc(50+i*80,220-v*2,4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#333';ctx.font='11px Segoe UI';ctx.fillText(labels[i],50+i*80-10,240); });
  } else if (type === 'pie') {
    let start = 0; const total = data.reduce((a,b)=>a+b,0);
    data.forEach((v,i) => { const ang = (v/total)*Math.PI*2; ctx.fillStyle=colors[i]; ctx.beginPath(); ctx.moveTo(200,130); ctx.arc(200,130,80,start,start+ang); ctx.fill(); start+=ang; });
  } else {
    ctx.fillStyle='#cce4f7'; ctx.beginPath(); ctx.moveTo(50,220);
    data.forEach((v,i) => ctx.lineTo(50+i*80,220-v*2));
    ctx.lineTo(50+data.length*80-80,220); ctx.fill();
  }
  const wrap = document.createElement('div');
  wrap.contentEditable = 'false';
  wrap.appendChild(canv);
  const cap = document.createElement('p'); cap.style.cssText='font-size:11px;color:#888;text-align:center'; cap.textContent = `${type.charAt(0).toUpperCase()+type.slice(1)} Chart`;
  wrap.appendChild(cap);
  editor.appendChild(wrap);
  closeModal(); saveUndo();
}

function doShape(type) {
  let svg = '';
  switch(type) {
    case 'rect': svg = `<svg width="200" height="100"><rect width="200" height="100" fill="#4a90d9" rx="4"/></svg>`; break;
    case 'circle': svg = `<svg width="120" height="120"><circle cx="60" cy="60" r="55" fill="#4a90d9"/></svg>`; break;
    case 'arrow': svg = `<svg width="200" height="60"><defs><marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/></marker></defs><line x1="0" y1="30" x2="190" y2="30" stroke="#4a90d9" stroke-width="6" marker-end="url(#ah)"/></svg>`; break;
    case 'star': svg = `<svg width="100" height="100"><polygon points="50,5 61,35 95,35 68,55 79,90 50,70 21,90 32,55 5,35 39,35" fill="#f5a623"/></svg>`; break;
    case 'heart': svg = `<svg width="100" height="90"><path d="M50,85 C20,60 0,40 0,25 C0,10 12,0 25,0 C35,0 45,8 50,18 C55,8 65,0 75,0 C88,0 100,10 100,25 C100,40 80,60 50,85Z" fill="#e74c3c"/></svg>`; break;
  }
  cmd('insertHTML', `<div style="display:inline-block;margin:8px" contenteditable="false" draggable="true">${svg}</div>`);
  closeModal(); saveUndo();
}

// References
function insertTOC() {
  const headings = editor.querySelectorAll('p[style*="font-size:18pt"],p[style*="font-size:15pt"],p[style*="font-size:13pt"],h1,h2,h3');
  let html = '<div style="border:1px solid var(--border);padding:16px;margin:12px 0;background:var(--panel-bg2);color:var(--text)" contenteditable="false"><b style="font-size:14pt">Table of Contents</b><hr>';
  if (!headings.length) html += '<p style="color:var(--text-2)">No headings found. Apply Heading styles to create a TOC.</p>';
  headings.forEach((h,i) => {
    const lvl = h.tagName==='H1'?'':'  ';
    html += `<p style="margin:4px 0;font-size:11pt">${lvl}${h.textContent.trim()} <span style="float:right;color:var(--text-2)">${i+1}</span></p>`;
  });
  html += '</div>';
  cmd('insertHTML', html);
}
function insertFootnote() {
  const n = editor.querySelectorAll('.footnote').length + 1;
  const text = prompt(`Footnote ${n} text:`);
  if (!text) return;
  cmd('insertHTML', `<sup class="footnote" style="color:#c00;cursor:pointer" onclick="alert('Footnote ${n}: ${text.replace(/'/g,"\\'")}')" title="Footnote ${n}">${n}</sup>`);
  const fn = document.createElement('div');
  fn.style.cssText = 'border-top:1px solid var(--blue);margin-top:20px;padding-top:8px;font-size:10pt;color:inherit';
  fn.innerHTML = `<sup>${n}</sup> ${text}`;
  editor.appendChild(fn);
}

let citationStyle = 'apa';

function insertCitation() {
  const author = prompt('Author:');
  if (!author) return;
  const year = new Date().getFullYear();
  const title = prompt('Title:');
  let cite = '';
  switch(citationStyle) {
    case 'apa': cite = `(${author}, ${year})`; break;
    case 'mla': cite = `(${author})`; break;
    case 'chicago': cite = `(${author} ${year})`; break;
    case 'harvard': cite = `(${author}, ${year})`; break;
  }
  cmd('insertText', cite);
}
