<script>
// ═══════════════ FIND / REPLACE ═══════════════
function showFind() { document.getElementById('find-replace-bar').style.display = 'block'; document.getElementById('find-input').focus(); }
function showReplace() { showFind(); }
function doFindNext() {
  const q = document.getElementById('find-input').value;
  if (!q) return;
  const found = window.find(q, false, document.getElementById('find-case').checked, false);
  document.getElementById('find-count').textContent = found ? 'Found' : 'Not found';
}
function doFindPrev() { /* basic: just search again */ doFindNext(); }
function doReplace() {
  const find = document.getElementById('find-input').value;
  const repl = document.getElementById('replace-input').value;
  const sel = window.getSelection();
  if (sel.toString().toLowerCase() === find.toLowerCase()) {
    sel.deleteContents();
    sel.insertNode(document.createTextNode(repl));
    saveUndo();
  } else { doFindNext(); }
}
function doReplaceAll() {
  const find = document.getElementById('find-input').value;
  const repl = document.getElementById('replace-input').value;
  if (!find) return;
  const esc = find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(esc, document.getElementById('find-case').checked ? 'g' : 'gi');
  let count = 0;
  const walk = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n => {
    if (re.test(n.textContent)) {
      const before = n.textContent;
      n.textContent = before.replace(re, () => { count++; return repl; });
      re.lastIndex = 0;
    }
  });
  document.getElementById('find-count').textContent = `Replaced ${count} occurrence${count!==1?'s':''}`;
  saveUndo(); updateStatus();
}
function showSelectMenu() {
  showModal('Select', `
    <button onclick="cmd('selectAll');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;cursor:pointer">Select All (Ctrl+A)</button>

    <button onclick="selectSimilarFormat();closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;cursor:pointer">Select Text with Similar Formatting</button>`);
}
function selectObjects() { alert('Click and drag to select objects, or use Ctrl+click for multiple selection.'); }
function selectSimilarFormat() {

  alert('Selecting all text with similar formatting...');
}

// ═══════════════ DICTATION ═══════════════
let dictating = false, recognition = null;
function toggleDictate() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported in this browser. Try Chrome or Edge.'); return; }
  if (dictating) { recognition.stop(); dictating = false; return; }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (final) editor.focus(), document.execCommand('insertText', false, final);
  };
  recognition.start();
  dictating = true;
  alert('🎤 Dictation started. Speak now... Click OK when done to stop.');
  recognition.stop(); dictating = false;
}

// ═══════════════ EDITOR / PROOFING ═══════════════
function showEditorPanel() {
  const pane = document.getElementById('editor-pane');
  pane.style.display = 'flex'; pane.style.flexDirection = 'column';
  const text = editor.innerText;
  const words = text.trim() ? text.trim().split(/\s+/) : [];
  let issues = 0, html = '';
  // Basic spell check
  const misspelled = [];
  words.forEach(w => {
    const clean = w.replace(/[^a-zA-Z']/g, '');
    if (clean.length > 3 && !COMMON_WORDS.has(clean.toLowerCase())) {
      issues++;
      misspelled.push(clean);
    }
  });
  html += `<div style="margin-bottom:12px"><b>Editor Score:</b> <span style="color:${issues>5?'#c00':issues>0?'#f5a623':'#2e7d32'};font-size:16pt;font-weight:700">${Math.max(0, 100 - issues * 3)}%</span></div>`;
  html += `<p style="color:#666;margin-bottom:8px">${words.length} words, ${issues} potential issues</p>`;
  if (misspelled.length) {
    html += `<b>Suggestions:</b><ul style="padding-left:16px;margin-top:4px">`;
    misspelled.slice(0, 10).forEach(w => { html += `<li style="margin:4px 0;color:#c00">${w}</li>`; });
    html += '</ul>';
  } else {
    html += '<p style="color:#2e7d32">&#10003; No major issues found!</p>';
  }
  document.getElementById('editor-results').innerHTML = html;
}

function showThesaurus() {
  const sel = window.getSelection().toString() || prompt('Enter a word:');
  if (!sel) return;
  const syns = { 'good': ['excellent','fine','great','superb','quality'], 'bad': ['poor','terrible','awful','dreadful','inferior'], 'big': ['large','huge','massive','enormous','giant'], 'small': ['tiny','little','miniature','compact','slight'], 'happy': ['glad','joyful','pleased','delighted','cheerful'], 'sad': ['unhappy','sorrowful','dejected','melancholy','gloomy'] };

}
function showWordCount() {

}
function checkAccessibility() {
  let issues = [];
  editor.querySelectorAll('img').forEach(img => { if (!img.alt) issues.push('Image missing alt text'); });
  const text = editor.innerText;
  if (!text.trim()) issues.push('Document is empty');
  if (text.length > 50000 && editor.querySelectorAll('h1,h2,h3').length === 0) issues.push('Long document without headings — add heading styles');
  showModal('Accessibility Checker', issues.length ? issues.map(i => `<p style="color:#c00;margin:4px 0">&#9888; ${i}</p>`).join('') : '<p style="color:#2e7d32">&#10003; No accessibility issues found!</p>');
}

// ═══════════════ READ ALOUD ═══════════════
function readAloud() {
  const sel = window.getSelection().toString() || editor.innerText;
  if (!sel.trim()) return;
  const u = new SpeechSynthesisUtterance(sel.substring(0, 5000));
  u.lang = 'en-US'; u.rate = 1;
  speechSynthesis.speak(u);
}

// ═══════════════ COMMENTS ═══════════════
let comments = [], commentIdx = -1;
function addComment() {
  const sel = window.getSelection().toString() || 'General comment';
  const text = prompt('Add a comment:');
  if (!text) return;
  comments.push({ text, quote: sel, resolved: false });
  renderComments();
  document.getElementById('comments-pane').style.display = 'block';
}
function renderComments() {
  const el = document.getElementById('comments-list');
  el.innerHTML = comments.map((c, i) => `
    <div style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:8px;margin-bottom:8px;${c.resolved?'opacity:.5':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <b style="font-size:12px">User</b>
        <span style="font-size:10px;color:#999">${new Date().toLocaleTimeString()}</span>
      </div>
      ${c.quote ? `<p style="font-size:11px;color:#666;border-left:2px solid #2b579a;padding-left:6px;margin-bottom:4px">"${c.quote}"</p>` : ''}
      <p style="font-size:12px">${c.text}</p>
      <div style="margin-top:6px">
        <button onclick="comments[${i}].resolved=!comments[${i}].resolved;renderComments()" style="font-size:11px;color:var(--blue);cursor:pointer">${c.resolved ? 'Unresolve' : 'Resolve'}</button>
        <button onclick="comments.splice(${i},1);renderComments()" style="font-size:11px;color:#c00;cursor:pointer;margin-left:8px">Delete</button>
      </div>
    </div>`).join('') || '<p style="color:#999;font-size:11px">No comments yet.</p>';
}
function deleteComment() { if (comments.length) { comments.pop(); renderComments(); } }
function prevComment() { if (commentIdx > 0) commentIdx--; }
function nextComment() { if (commentIdx < comments.length - 1) commentIdx++; }
function resolveComment() { if (commentIdx >= 0 && comments[commentIdx]) { comments[commentIdx].resolved = true; renderComments(); } }

// ═══════════════ TRACK CHANGES ═══════════════
let trackChanges = false;
function toggleTrackChanges() {
  trackChanges = !trackChanges;
  document.getElementById('btn-trackchanges').classList.toggle('active', trackChanges);
  document.getElementById('sb-track').style.display = trackChanges ? 'inline' : 'none';
  if (trackChanges) {
    editor.addEventListener('input', trackInput);
  } else {
    editor.removeEventListener('input', trackInput);
  }
}
function trackInput() {
  // Simple visual indicator for tracked changes
  editor.querySelectorAll('ins,del').forEach(el => {
    if (el.style.display === '') {
      if (el.tagName === 'INS') el.style.cssText = 'text-decoration:underline;color:#2e7d32';
    }
  });
}

  if (v === 'original') alert('Showing original document (tracked changes hidden).');

    <label style="display:block;margin:8px 0"><input type="checkbox" id="restrict-edit"> Editing restrictions (read only)</label>

function showMacros() {
  showModal('Macros', `
    <p style="margin-bottom:8px">Macro name:</p>

    <button onclick="runMacro()" style="padding:6px 16px;border:1px solid #ddd;border-radius:4px;cursor:pointer;margin-right:8px">Run</button>

let macros = [];
function recordMacro() {
  const name = prompt('Macro name:', 'Macro' + (macros.length + 1));
  if (!name) return;
  alert('Recording macro "' + name + '". Perform actions, then stop recording.');
  macros.push({ name, steps: [] });
  setTimeout(() => alert('Macro recording stopped.'), 5000);
}
function createMacro() {
  const name = document.getElementById('macro-name').value;
  if (!name) return;
  const code = prompt('Enter macro code:\nAvailable commands: bold, italic, underline, insertText(text), applyStyle(name)');
  if (!code) return;
  macros.push({ name, code });
  closeModal();
}
function runMacro() {
  const name = document.getElementById('macro-name')?.value;
  const m = macros.find(x => x.name === name);
  if (!m) { alert('Macro not found.'); return; }
  try {
    if (m.code) {
      const fn = new Function('cmd','editor','alert', m.code);
      fn(cmd, editor, alert);
    }
  } catch(e) { alert('Macro error: ' + e.message); }
  closeModal();
}

// ═══════════════ DRAW ═══════════════
let drawing = false, drawMode = false, currentPen = 'pen', strokes = [];
function setPen(p) {
  currentPen = p;
  document.getElementById('btn-drawmode')?.classList.add('active');
  if (!drawMode) toggleDrawMode();
}
function toggleDrawMode() {
  drawMode = !drawMode;
  document.getElementById('btn-drawmode').classList.toggle('active', drawMode);
  const canvas = document.getElementById('ink-canvas');
  if (drawMode) {
    const pc = document.getElementById('page-container');
    canvas.width = pc.scrollWidth; canvas.height = pc.scrollHeight;
    canvas.style.display = 'block';
    canvas.style.pointerEvents = 'auto';
    canvas.style.cursor = 'crosshair';
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', doDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', doDraw);
    canvas.addEventListener('touchend', endDraw);
  } else {
    canvas.style.display = 'none';
    canvas.style.pointerEvents = 'none';
    canvas.removeEventListener('mousedown', startDraw);
    canvas.removeEventListener('mousemove', doDraw);
    canvas.removeEventListener('mouseup', endDraw);
    canvas.removeEventListener('touchstart', startDraw);
    canvas.removeEventListener('touchmove', doDraw);
    canvas.removeEventListener('touchend', endDraw);
  }
}
function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const canvas = document.getElementById('ink-canvas');
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  strokes.push([{ x, y, color: document.getElementById('pen-color').value, size: document.getElementById('pen-size').value, type: currentPen }]);
}
function doDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const canvas = document.getElementById('ink-canvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const stroke = strokes[strokes.length - 1];
  const prev = stroke[stroke.length - 1];
  ctx.strokeStyle = stroke[0].color;
  ctx.lineWidth = stroke[0].size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (stroke[0].type === 'highlighter') { ctx.globalAlpha = 0.3; ctx.lineWidth = parseInt(stroke[0].size) * 3; }
  else ctx.globalAlpha = 1;
  if (stroke[0].type === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 20;
  }
  ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  stroke.push({ x, y });
}
function endDraw() { drawing = false; }
function clearInk() {
  const canvas = document.getElementById('ink-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  strokes = [];
}
function inkToShape() { alert('Ink to Shape: Draw a shape and it will be auto-corrected.'); }
function inkToMath() { alert('Ink to Math: Draw a mathematical equation and it will be converted to typed LaTeX.'); }

function applyTheme(t) {
  const themes = {
    default: { heading: '#2b579a', accent: '#4a90d9' },
    blue: { heading: '#1565c0', accent: '#42a5f5' },
    dark: { heading: '#222', accent: '#555' },
    green: { heading: '#2e7d32', accent: '#66bb6a' },
    red: { heading: '#c62828', accent: '#ef5350' }
  };
  const th = themes[t] || themes.default;
  editor.querySelectorAll('p').forEach(p => {
    const fs = parseInt(getComputedStyle(p).fontSize);
    if (fs > 14) p.style.color = th.heading;
  });
  editor.style.setProperty('--accent', th.accent);
}

// ═══════════════ LAYOUT ═══════════════

function setIndent(side, val) {
  const sel = window.getSelection();
  let node = sel.anchorNode;
  while (node && node !== editor && node.tagName !== 'P' && node.tagName !== 'DIV') node = node.parentElement;
  if (node && node !== editor) { if (side === 'left') node.style.marginLeft = val + 'px'; else node.style.marginRight = val + 'px'; }
  saveUndo();
}

  showModal('Envelopes', `

function startMailMerge(type) { alert(`Mail merge started: ${type.charAt(0).toUpperCase()+type.slice(1)}`); }
function selectRecipients() {
  showModal('Select Recipients', `
    <button onclick="addRecipientManually()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;cursor:pointer">Type a New List...</button>
    <button onclick="useExistingList()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;cursor:pointer">Use an Existing List...</button>
    <button onclick="alert('Connect to Outlook contacts.')" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;cursor:pointer">Choose from Outlook Contacts...</button>`);
}
function addRecipientManually() {
  const name = prompt('Recipient name:');
  const email = prompt('Recipient email:');
  if (name) { mailMergeData.push({ name, email }); mergeFieldNames = ['name', 'email']; }
  closeModal();
}
function useExistingList() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.csv,.txt,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const lines = r.result.split('\n');
        const headers = lines[0].split(',').map(h => h.trim());
        mergeFieldNames = headers;
        mailMergeData = lines.slice(1).filter(l => l.trim()).map(l => {
          const vals = l.split(',');
          const obj = {}; headers.forEach((h, i) => obj[h] = vals[i]?.trim() || '');
          return obj;
        });
        alert(`Loaded ${mailMergeData.length} recipients with fields: ${headers.join(', ')}`);
      } catch(e) { alert('Error reading file: ' + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
  closeModal();
}
function insertMergeField() {
  if (!mergeFieldNames.length) { alert('Select recipients first.'); return; }
  let html = '<p style="margin-bottom:8px"><b>Insert Merge Field:</b></p>';
  mergeFieldNames.forEach(f => {
    html += `<button onclick="cmd('insertText','«${f}»');closeModal()" style="display:block;width:100%;text-align:left;padding:6px 12px;border:1px solid #ddd;border-radius:4px;margin-bottom:4px;cursor:pointer">«${f}»</button>`;
  });
  showModal('Insert Merge Field', html);
}
function insertAddressBlock() { cmd('insertHTML', '<p style="background:#f0f4ff;padding:8px;border-radius:4px">«AddressBlock»</p>'); }
function insertGreetingLine() { cmd('insertHTML', '<p style="background:#f0f4ff;padding:8px;border-radius:4px">«GreetingLine»,</p>'); }
function previewMerge() {
  if (!mailMergeData.length) { alert('No recipient data. Select recipients first.'); return; }
  const record = mailMergeData[0];
  let text = editor.innerHTML;
  mergeFieldNames.forEach(f => { text = text.replaceAll(`«${f}»`, record[f] || `[${f}]`); });
  alert('Preview with first record:\n\n' + text.replace(/<[^>]+>/g, '').substring(0, 500));
}
function finishMerge(action) {
  if (!mailMergeData.length) { alert('No recipients. Select recipients first.'); return; }
  if (action === 'print') window.print();
  else {
    const emails = mailMergeData.map(r => r.email).filter(Boolean);
    const subject = prompt('Email subject:', 'Mail Merge Document');
    if (subject) shareByEmail();
  }
}

const COLORS = [
  '#000000','#434343','#666666','#999999','#b7b7b7','#cccccc','#d9d9d9','#efefef','#f3f3f3','#ffffff',
  '#980000','#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#4a86e8','#0000ff','#9900ff','#ff00ff',
  '#e6b8af','#f4cccc','#fce5cd','#fff2cc','#d9ead3','#d0e0e3','#c9daf8','#cfe2f3','#d9d2e9','#ead1dc',
  '#cc4125','#dd7e6b','#f6b26b','#ffd966','#93c47d','#76a5af','#6d9eeb','#6fa8dc','#8e7cc3','#c27ba0'
];
function generateColorSwatches(fnName) {
  return COLORS.map(c => `<div class="swatch" style="background:${c}" onclick="${fnName}('${c}')" title="${c}"></div>`).join('');
}
// Initialize all color grids
['highlight-grid','fontcolor-grid','shading-grid','text-effects-grid'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  const cmdName = id === 'highlight-grid' ? 'hiliteColor' : id === 'shading-grid' ? 'hiliteColor' : 'foreColor';
  el.innerHTML = COLORS.map(c => `<div class="swatch" style="background:${c}" onclick="cmd('${cmdName}','${c}')" title="${c}"></div>`).join('');
});

// Borders menu
function showBordersMenu(btn) {
  showModal('Borders', `
    <button onclick="cmd('insertHTML','<hr>');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:4px;cursor:pointer">Horizontal Line</button>
    <button onclick="applyParaBorder('top');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:4px;cursor:pointer">Top Border</button>
    <button onclick="applyParaBorder('bottom');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;margin-bottom:4px;cursor:pointer">Bottom Border</button>
    <button onclick="applyParaBorder('all');closeModal()" style="display:block;width:100%;text-align:left;padding:8px;border:1px solid #ddd;border-radius:4px;cursor:pointer">All Borders</button>`);
}
function applyParaBorder(pos) {
  const sel = window.getSelection();
  let node = sel.anchorNode;
  while (node && node !== editor && node.tagName !== 'P' && node.tagName !== 'DIV') node = node.parentElement;
  if (node && node !== editor) {
    if (pos === 'top') node.style.borderTop = '1px solid #000';
    else if (pos === 'bottom') node.style.borderBottom = '1px solid #000';
    else node.style.border = '1px solid #000';
  }
  saveUndo();
}

// ═══════════════ MODAL ═══════════════
function showModal(title, html) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

// Dropdown helpers
function toggleDropdown(btn, menuId) {
  closeDropdowns();
  document.getElementById(menuId)?.classList.toggle('show');
}
function closeDropdowns() { document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show')); }
document.addEventListener('click', (e) => { if (!e.target.closest('.dropdown')) closeDropdowns(); });
